name: photodrive APK

on:
  push:
    paths:
      - "photodrive/**"
      - ".github/workflows/photodrive.yml"
  pull_request:
    paths:
      - "photodrive/**"
      - ".github/workflows/photodrive.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photodrive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: photodrive-apk
          path: photodrive/app/build/outputs/apk/debug/app-debug.apk
