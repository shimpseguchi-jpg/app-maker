name: photodrive APK

on:
  push:
    paths:
      - "photodrive/**"
      - ".github/workflows/photodrive.yml"
  pull_request:
    paths:
      - "photodrive/**"
      - ".github/workflows/photodrive.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photodrive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Google ログインのため、いつも同じ鍵で署名する（鍵は Secrets に置く。README 参照）
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTODRIVE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHOTODRIVE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::PHOTODRIVE_KEYSTORE_BASE64 がないので、毎回変わる仮の鍵で署名します（Google ログインは使えません）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/photodrive.jks"
          echo "PHOTODRIVE_KEYSTORE=$RUNNER_TEMP/photodrive.jks" >> "$GITHUB_ENV"
          echo "PHOTODRIVE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "署名鍵の SHA-1（Google Cloud の Android クライアントに登録するもの）:"
          keytool -list -v -keystore "$RUNNER_TEMP/photodrive.jks" -storepass "$KEYSTORE_PASSWORD" -alias photodrive | grep "SHA1:"
      - name: Test
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: photodrive-apk
          path: photodrive/app/build/outputs/apk/debug/app-debug.apk
