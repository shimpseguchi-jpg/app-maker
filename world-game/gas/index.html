<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%230d121c%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2232%22%20fill%3D%22%231c3a5e%22%20stroke%3D%22%234f8fd6%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M18%2050h64M50%2018c-12%2010-12%2054%200%2064M50%2018c12%2010%2012%2054%200%2064%22%20stroke%3D%22%234f8fd6%22%20stroke-width%3D%222.5%22%20fill%3D%22none%22%2F%3E%3Cpolygon%20points%3D%2250%2C36%2063%2C44%2063%2C58%2050%2C66%2037%2C58%2037%2C44%22%20fill%3D%22%23f2b632%22%20stroke%3D%22%237a5a10%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E%0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d121c; --panel: #161e2d; --panel2: #1c2638; --line: #2a3650; --text: #e6ecf5; --muted: #8b98b0;
  --gold: #f2b632; --red: #e5534b; --green: #46b37b; --blue: #4f8fd6; --purple: #a676d6;
  --eco: #e0a030; --edu: #4fa3d6; --res: #b08850; --fw: #3bb3a3; --dom: #9b7bd1; --dip: #46b37b; --mil: #e5534b; --intl: #f2b632;
  --r: 10px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #070a10; color: var(--text); overflow: hidden;
  font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
#stage { position: absolute; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.muted { color: var(--muted); }
.good { color: var(--green); } .bad { color: var(--red); }
.btn { padding: 10px 18px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-weight: 700; transition: transform .08s, background .15s; }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--gold); color: #1a1406; border-color: var(--gold); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; }

/* ── タイトル ── */
.title { align-items: center; justify-content: center; gap: 18px; background:
  radial-gradient(ellipse at 50% 40%, rgba(79,143,214,.18), transparent 60%), var(--bg); }
.title .map-bg { position: absolute; inset: 0; opacity: .14; display: flex; align-items: center; justify-content: center; }
.title .map-bg svg { width: 110%; }
.title h1 { margin: 0; font-size: 52px; letter-spacing: .12em; font-weight: 900; position: relative; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
.title h1 small { display: block; font-size: 15px; letter-spacing: .3em; color: var(--muted); font-weight: 500; text-align: center; margin-top: 6px; }
.title .menu { display: flex; flex-direction: column; gap: 10px; width: 300px; position: relative; }
.title .menu .btn { padding: 14px; font-size: 17px; }
.title .seedrow { display: flex; gap: 8px; }
.title .seedrow input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; color: var(--text); padding: 10px 14px; font: inherit; letter-spacing: .15em; text-transform: uppercase; }
.title .note { position: absolute; bottom: 14px; font-size: 12px; color: var(--muted); text-align: center; width: 100%; }
.title .cloudnote { position: absolute; bottom: 36px; font-size: 13px; color: var(--muted); text-align: center; width: 100%; }
.title .loading { font-size: 18px; color: var(--muted); text-align: center; }

/* ── 共通：GM の吹き出し ── */
.gm { display: flex; gap: 10px; align-items: flex-start; }
.gm .face { flex: none; width: 42px; height: 42px; border-radius: 50%; background: #2a2a38; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--gold); font-size: 13px; }
.gm .bubble { background: #f4efe2; color: #1d1a12; padding: 10px 14px; border-radius: 4px 14px 14px 14px; font-size: 14.5px; line-height: 1.6; position: relative; }
.gm .bubble b.name { display: block; font-size: 11px; color: #7a6a3d; margin-bottom: 2px; letter-spacing: .1em; }

/* ── 準備画面 ── */
.setup { padding: 18px 22px; gap: 12px; }
.setup .head { display: flex; align-items: center; justify-content: space-between; }
.setup .head h2 { margin: 0; font-size: 22px; }
.setup .body { flex: 1; display: grid; grid-template-columns: 1fr 360px; gap: 16px; min-height: 0; }
.setup .mapbox { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.setup .seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.setup .seat { display: flex; gap: 8px; align-items: center; background: var(--panel2); border-radius: 8px; padding: 6px 8px; font-size: 13px; border: 1px solid transparent; }
.setup .seat.mine { border-color: var(--gold); }
.setup .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.setup .bases { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; overflow: auto; }
.setup .base { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; }
.setup .base small { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; margin-top: 2px; }
.setup .base.on { border-color: var(--gold); background: #2a2412; }
.setup .foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }

/* ── 国旗 ── */
.flag { display: inline-block; flex: none; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.18); overflow: hidden; vertical-align: middle; }

/* ── ダッシュボード ── */
.dash { display: grid; grid-template-rows: 54px 1fr auto; grid-template-columns: minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #0a0f18; border-bottom: 1px solid var(--line); }
.top .year { font-size: 22px; font-weight: 900; letter-spacing: .04em; white-space: nowrap; }
.top .year small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.stages { display: flex; gap: 2px; }
.stages span { font-size: 10px; padding: 3px 5px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.stages span:first-child { border-radius: 999px 0 0 999px; } .stages span:last-child { border-radius: 0 999px 999px 0; }
.stages span.on { background: var(--blue); color: #fff; } .stages span.now { background: var(--gold); color: #1a1406; font-weight: 700; }
.gauges { display: flex; gap: 2px; flex: 1; justify-content: flex-end; min-width: 0; overflow: hidden; }
.gauge { display: flex; flex-direction: column; align-items: center; min-width: 44px; padding: 2px 3px; border-radius: 6px; }
.gauge b { font-size: 14px; line-height: 1.1; white-space: nowrap; }
.gauge i { font-style: normal; font-size: 10px; color: var(--muted); white-space: nowrap; }
.gauge.warn b { color: var(--gold); } .gauge.danger { background: rgba(229,83,75,.16); } .gauge.danger b { color: var(--red); }
.top .tools { display: flex; gap: 6px; }

.mid { display: grid; grid-template-columns: 250px 1fr 250px; gap: 8px; padding: 8px; min-height: 0; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.pane h3 { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: .1em; padding: 8px 10px 4px; font-weight: 700; }

.me { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.me .name { display: flex; gap: 8px; align-items: center; font-weight: 900; font-size: 16px; line-height: 1.2; }
.me .sub { font-size: 11.5px; color: var(--muted); }
.powerbar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.powerbar i { display: block; height: 100%; background: var(--gold); }
.stats { overflow: auto; flex: 1; margin: 0 -4px; padding: 0 4px; }
.stats details { border-top: 1px solid var(--line); }
.stats summary { list-style: none; font-size: 12px; color: var(--muted); padding: 5px 0; display: flex; justify-content: space-between; cursor: pointer; }
.stats summary::-webkit-details-marker { display: none; }
.stats summary .alert { color: var(--red); font-weight: 700; }
.stat { display: flex; justify-content: space-between; font-size: 12.5px; padding: 2px 0; }
.stat b { font-weight: 700; font-variant-numeric: tabular-nums; }
.stat.danger b { color: var(--red); } .stat.danger span::before { content: '⚠ '; color: var(--red); }
.stat .d { font-size: 10.5px; margin-left: 4px; }
.offline { background: repeating-linear-gradient(45deg, rgba(229,83,75,.12) 0 8px, transparent 8px 16px); border: 1px dashed var(--red); border-radius: 8px; padding: 8px; font-size: 12.5px; }

.center { display: grid; grid-template-rows: auto 1fr; gap: 8px; min-height: 0; }
.mapwrap { position: relative; background: #0b1a2c; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mapwrap svg { display: block; width: 100%; height: auto; }
.mapwrap .legend { position: absolute; left: 8px; bottom: 6px; display: flex; gap: 8px; font-size: 10.5px; color: var(--muted); }
.mapwrap .seedtag { position: absolute; right: 8px; bottom: 6px; font-size: 10.5px; color: var(--muted); letter-spacing: .1em; }
.land { stroke: #0b1a2c; stroke-width: .6; cursor: pointer; }
/* 塗りと同じ色でふちを描いて、まとまりの中のすきまを消す。境界線は .borders で上から描く */
#stage .mapwrap .land, .setup .land { stroke-width: .5; }
.land.bg { fill: #3a4558; stroke: #3a4558; }
.borders { fill: none; stroke: #0b1a2c; stroke-width: .7; pointer-events: none; stroke-linejoin: round; } .land.bg.owned { opacity: .9; } .land.bg.sunk { fill: #1e3550; stroke: #1e3550; }
.land.off { fill-opacity: .45 !important; }
.land.ant { fill: #c9d6e6; cursor: default; }
.maplabel { font-size: 11px; font-weight: 700; fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,.75); stroke-width: 3px; pointer-events: none; }
.maplabel.me { fill: var(--gold); }
.mk { pointer-events: none; }

.feed { overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.55; }
.feed .ev { background: #23180f; border: 1px solid #5a3e1e; border-radius: 8px; padding: 7px 10px; }
.feed .ev b { color: #ffcc80; display: block; font-size: 13.5px; }
.feed .ev.spark { background: #2a1210; border-color: #a0402a; }
.feed .ev.spark b { color: #ff9a6a; }
.spk { font-size: 11px; font-weight: 700; white-space: nowrap; }
.sparks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.sparks h3 { padding: 2px 0; color: #ff9a6a; }
.sparkcard { background: #2a1210; border: 1px solid #a0402a; border-radius: 8px; padding: 7px 8px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
.sparkcard .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.sparkcard .meta { font-size: 11px; color: var(--muted); }
.feed .gmline { color: #f4e7c4; } .feed .gmline::before { content: 'GM ▸ '; color: var(--gold); font-weight: 700; font-size: 11px; }
.feed .act { display: flex; gap: 6px; align-items: center; }
.feed .act .who { font-weight: 700; white-space: nowrap; }
.feed .act .pol { flex: 1; min-width: 0; }
.feed .sys { color: var(--muted); font-size: 12px; } .feed .sys.bad { color: #ff9a92; } .feed .sys.good { color: #8fe0b4; }
.feed .ailine { color: var(--muted); font-size: 12px; padding-left: 14px; }
.feed .vote { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
.tier { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.tier.crit { background: var(--gold); color: #1a1406; } .tier.ok { background: var(--green); color: #fff; }
.tier.partial { background: #6c7a3a; color: #fff; } .tier.ng { background: #5a6478; color: #fff; } .tier.fumble { background: var(--red); color: #fff; }
.roll { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.rivals { overflow: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 6px; }
.rival { background: var(--panel2); border-radius: 8px; padding: 7px 8px; display: flex; flex-direction: column; gap: 4px; border-left: 4px solid var(--c); cursor: pointer; }
.rival .row { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.rival .row b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rival .meta { display: flex; gap: 6px; font-size: 11px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.rival .last { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rival.off { opacity: .55; background: repeating-linear-gradient(45deg, rgba(229,83,75,.1) 0 8px, transparent 8px 16px), var(--panel2); }
.relbar { width: 46px; height: 5px; background: #3a4558; border-radius: 3px; overflow: hidden; display: inline-block; }
.relbar i { display: block; height: 100%; }

.bottom { background: #0a0f18; border-top: 1px solid var(--line); padding: 10px 12px; display: grid; grid-template-columns: 300px 1fr; gap: 12px; min-height: 196px; }
.bottom .gm .bubble { max-height: 150px; overflow: auto; }
.actions { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.actions .waiting { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 14px; }
.card { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--cc); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; text-align: left; position: relative; transition: transform .1s, border-color .15s; }
.card:active { transform: scale(.98); }
.card.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.card .cat { font-size: 10.5px; color: var(--cc); font-weight: 700; letter-spacing: .08em; display: flex; justify-content: space-between; }
.card .cat .ins { color: #ffcc80; }
.card h4 { margin: 0; font-size: 14.5px; line-height: 1.3; }
.card .prob { display: flex; align-items: baseline; gap: 6px; }
.card .prob b { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.card .prob small { font-size: 10.5px; color: var(--muted); }
.card .fx { font-size: 11px; line-height: 1.45; color: #cfe; }
.card .fx.ng { color: #f3b1ab; }
.card .tg { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px; }
.card .tg button { font-size: 11px; padding: 3px 7px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
.card .tg button.on { background: var(--gold); color: #1a1406; border-color: var(--gold); }
.card .go { margin-top: 4px; }

/* ── ダイス ── */
.dice-back { position: absolute; inset: 0; background: rgba(5,8,14,.72); display: flex; align-items: center; justify-content: center; z-index: 50; }
.dice-box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.dice { width: 170px; height: 170px; position: relative; }
.dice svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)); }
.dice .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 900; color: #1a1406; font-variant-numeric: tabular-nums; }
.dice.spin svg { animation: spin .5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.dice-box .need { font-size: 15px; color: var(--muted); }
.dice-box .res { font-size: 34px; font-weight: 900; letter-spacing: .1em; min-height: 46px; }
.dice-box .res.crit { color: var(--gold); text-shadow: 0 0 18px rgba(242,182,50,.7); } .dice-box .res.ok { color: var(--green); }
.dice-box .res.partial { color: #c6d36b; } .dice-box .res.ng { color: #b8c2d6; } .dice-box .res.fumble { color: var(--red); }
.dice-box .changes { font-size: 13px; color: var(--text); max-width: 560px; text-align: center; line-height: 1.7; background: rgba(22,30,45,.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.dice-box .changes:empty { display: none; }

/* ── モーダル ── */
.modal-back { position: absolute; inset: 0; background: rgba(5,8,14,.7); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; width: 620px; max-width: 92%; max-height: 88%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal h2 { margin: 0; font-size: 20px; }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.modal.nuke { border-color: var(--red); box-shadow: 0 0 60px rgba(229,83,75,.35); }
.modal .opts { display: flex; flex-direction: column; gap: 8px; }
.modal .opt { text-align: left; padding: 12px 14px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-weight: 700; }
.chron { font-size: 13px; line-height: 1.7; }
.chron div { display: grid; grid-template-columns: 54px 1fr; border-bottom: 1px solid var(--line); padding: 2px 0; }
.chron div span:first-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }

/* ── 年末・結末 ── */
.yearend { flex: 1; display: flex; align-items: center; gap: 14px; }
.yearend .sum { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.6; }
.ending { padding: 22px 28px; gap: 14px; overflow: auto; background: radial-gradient(ellipse at 50% 0%, rgba(242,182,50,.12), transparent 60%), var(--bg); }
.ending.badend { background: radial-gradient(ellipse at 50% 0%, rgba(229,83,75,.16), transparent 60%), var(--bg); }
.ending h1 { margin: 0; font-size: 44px; letter-spacing: .1em; }
.ending .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
.ending .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ending .num { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.ending .num b { display: block; font-size: 22px; } .ending .num i { font-style: normal; font-size: 11px; color: var(--muted); }
.ending .chron { max-height: 330px; overflow: auto; background: var(--panel); border-radius: 10px; padding: 8px 12px; }
.spark { background: var(--panel); border-radius: 10px; padding: 8px; }

.rotate-hint { display: none; }
@media (orientation: portrait) and (max-width: 900px) {
  body:not(.allow-portrait) .rotate-hint { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg); text-align: center; }
  .rotate-hint .ph { font-size: 64px; transform: rotate(90deg); }
}

/* ── 1ねんせいモード ── */
.title .modes { display: flex; gap: 6px; justify-content: center; }
.title .modes .btn { flex: 1; }
.title .sizerow { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.title .sizerow input { flex: 1; accent-color: var(--gold); }
.title .sizerow b { color: var(--gold); font-size: 18px; min-width: 2em; text-align: right; }
.kid { --kidfs: 15px; }
.kid .gm .bubble { font-size: 16px; line-height: 1.75; }
.kid .feed { font-size: 14.5px; line-height: 1.7; }
.kid .card h4 { font-size: 15.5px; line-height: 1.45; }
.kid .card .fx { font-size: 12.5px; }
.kid .gauge i { font-size: 11px; }
.kid .gauge { min-width: 84px; }
.setup .side .pane { flex: none; }
.kid .gauge b { font-size: 17px; }
.kid .base { font-size: 14px; }
.kid .base small { font-size: 12px; }
.kid .modal { font-size: 15px; line-height: 1.75; }
.howto p { margin: 0 0 8px; font-size: 15px; line-height: 1.8; }
.kidstats { display: flex; flex-direction: column; gap: 7px; overflow: auto; }
.kidstats.small { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; }
.kstat { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.kidstats.small .kstat { font-size: 12px; }
.kstat.danger span:first-child { color: var(--red); }
.kstat.danger span:first-child::after { content: ' ⚠'; }
.kbar { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }

ond:L=>(L.counters.aidHigh||0)>=3,who:L=>E(f(L),e=>e.stats.capital).id,run:(L,e,t)=>{let s=g1(L,a=>a.stats.debt>=70);s&&(L.backs[s].stats.stability-=10,e.say(`返済できなくなった${L.backs[s].name}の港が、担保として取り上げられた。`))},fx:["who.bases+s","who.rep-m"],ins:["P120","P53"],text:"{who}が貸した道路と港の代金が、返ってこない。代わりに受け取ったのは、その港そのものだった。"},{id:"E103",name:"租税回避地",cat:"eco",w:10,cond:L=>P(L)>=6,run:(L,e)=>{L.flags.taxHaven=L.year;let t=f(L).find(s=>s.id==="M14");for(let s of f(L))e.fx([s===t?"who.capital+m":"who.fiscal-s"],{who:s.id})},ins:["P100"],text:"大企業と大富豪の資産が、税金のほとんどかからない小さな島や都市に流れている。ほかの国の税収は、そのぶん減る。"},{id:"E104",name:"貿易ルールの機能停止",cat:"eco",w:10,cond:L=>L.world.treaty<=40&&P(L)>=8,fx:["world.treaty-m","majors.gnp-s"],ins:["P05","P51"],text:"貿易の揉め事を裁く国際機関が、判事を選べずに止まった。ルールを守らない国を、誰も止められない。"},{id:"E105",name:"電子ゴミの押し付け",cat:"eco",w:8,cond:L=>Y(L,"tech")>=65,run:(L,e)=>{for(let t of f(L))t.stats.tech>=80&&e.fx(["who.rep-s"],{who:t.id})},fx:["poorBg.stability-s","world.biodiv-s"],ins:["P91"],text:"豊かな国で捨てられた電子機器が、貧しい国のゴミ山で燃やされている。子どもたちが、煙の中で金属を拾っている。"},{id:"E106",name:"偽情報の拡散",cat:"tech",w:12,repeat:8,cond:L=>L.flags.internet!=null,fx:["majors.stability-s","world.trust-m"],ins:["P101","P88","P87"],text:"誰が書いたかもわからない嘘が、真実より速く広がっている。人々は、信じたいものを信じる。"},{id:"E107",name:"監視社会",cat:"tech",w:8,cond:L=>f(L).some(e=>(e.flags.censor||0)>=1&&e.stats.tech>=70),who:L=>f(L).find(e=>(e.flags.censor||0)>=1&&e.stats.tech>=70).id,fx:["who.security+m","who.rep-m","who.mobility-s"],ins:["P101"],text:"{who}の街角のカメラが、すべての国民の顔を覚えている。犯罪は減った。不満を口にする人も減った。"},{id:"E108",name:"宇宙ゴミの連鎖衝突",cat:"tech",w:10,cond:L=>(L.counters.space||0)>=2||P(L)>=25,run:(L,e)=>{for(let t of f(L))t.stats.tech>=70&&e.fx(["who.tech-s","who.gnp-s"],{who:t.id})},ins:["P90"],text:"軌道上のゴミが衛星にぶつかり、その破片がまた別の衛星を壊していく。天気予報も、位置情報も、しばらく使えない。"},{id:"E109",name:"自律型兵器の戦争",cat:"mil",w:10,cond:L=>Y(L,"tech")>=72&&L.world.tension>=45,run:L=>{L.flags.drones=L.year},fx:["world.tension+m","world.conflicts+m"],ins:["P102","P60"],text:"人間の判断を待たずに標的を選ぶ兵器が、戦場に投入された。安くて、疲れず、命令を疑わない。"},{id:"E110",name:"民間軍事会社",cat:"mil",w:8,cond:L=>L.world.conflicts>=70,run:(L,e)=>{let t=g1(L,s=>s.stats.stability<=30);t&&e.fx(["who.stability-m"],{who:t})},fx:["world.conflicts+s"],ins:["P56","P116"],text:"国の軍隊ではなく、会社が戦争を請け負っている。彼らに国際法は届きにくい。"},{id:"E111",name:"ポピュリズムの台頭",cat:"society",w:12,repeat:10,cond:L=>f(L).some(e=>e.stats.inequality>=60&&e.stats.stability<=65),who:L=>E(f(L).filter(e=>e.stats.inequality>=60),e=>e.stats.inequality).id,run:(L,e,t)=>{for(let s of f(L))s.id!==t&&e.addRel(t,s.id,-8)},fx:["who.stability-s","who.rep-s"],ins:["P41","P43"],text:"{who}で、「悪いのは外国だ」と叫ぶ候補が支持を集めている。わかりやすい答えほど、よく売れる。"},{id:"E112",name:"麻薬カルテル",cat:"society",w:10,cond:L=>["B01","B07","B04"].some(e=>i2(L,e)&&n2(L,e).stats.stability<=45),who:L=>["B01","B07","B04"].find(e=>i2(L,e)&&n2(L,e).stats.stability<=45),run:(L,e,t)=>{for(let s of q(t))L.majors[s]?.panel&&e.fx(["who.security-s"],{who:s})},fx:["who.stability-m"],ins:["P40","P53"],text:"{who}では、麻薬組織が軍隊より強い武器を持っている。役人も警察も、組織に給料をもらっている。"},{id:"E113",name:"人身売買",cat:"society",w:8,cond:L=>L.world.refugees>=55,fx:["majors.security-s","world.trust-s"],ins:["P42","P40"],text:"逃げてきた人々を、売り買いする者たちがいる。国境が閉じられるほど、彼らの商売は繁盛する。"},{id:"E114",name:"大河のダム争い",cat:"fw",w:6,repeat:20,cond:L=>P(L)>=6&&["B17","B24"].some(e=>i2(L,e)),who:L=>["B17","B24"].find(e=>i2(L,e)),run:(L,e,t)=>e.spark("dam",t),ins:["P116","P53"],text:"大河の上流の{who}が巨大なダムを造った。下流の国々にとって、川の水は命そのものだ。"},{id:"E115",name:"首都の水没と移転",cat:"env",w:12,cond:L=>L.world.ice<=58&&f(L).some(e=>["M15","M13","M11"].includes(e.id)),who:L=>f(L).find(e=>["M15","M13","M11"].includes(e.id)).id,fx:["who.fiscal-l","who.gnp-s","who.stability-s"],text:"{who}の首都が、毎年数センチずつ沈んでいる。首都を丸ごと別の島に移す計画が動き出した。"},{id:"E116",name:"世界恐慌",cat:"eco",w:40,cond:L=>L.flags.finCrisis!=null&&w1(L,"E37")&&!w1(L,"E116"),fx:["majors.gnp-l","majors.stability-m","bgAll.econ-m","world.treaty-m"],run:(L,e)=>e.deaths(1),ins:["P84","P05"],next:["E111"],text:"金融の崩壊と関税の殴り合いが重なって、世界中の経済が止まった。失業者の列が、どの国の街角にもできている。"},{id:"E117",name:"通貨と金の交換停止",cat:"eco",w:8,cond:L=>P(L)>=10&&f(L).some(e=>e.stats.gnp>=15&&e.stats.fiscal<=-6),fx:["world.wrate+m","world.trust-s"],text:"世界の基軸通貨を、金と交換するという約束がなくなった。お金の価値は、信用だけが支えるものになった。"},{id:"E118",name:"通貨の協調介入",cat:"eco",w:30,cond:L=>L.flags.currency!=null&&L.allies.length>=2,fx:["majors.gnp+s","world.trust+s"],text:"大国の財務大臣たちが、ホテルの一室で通貨の値段を決めた。うまくいったかどうかは、十年後にわかる。"},{id:"E119",name:"ネットバブルの崩壊",cat:"eco",w:10,cond:L=>L.flags.internet!=null&&Y(L,"capital")>=60,fx:["majors.capital-m","majors.gnp-s"],text:"名前に「ネット」と付けば株価が上がった時代が、あっけなく終わった。"},{id:"E120",name:"代理戦争",cat:"mil",w:10,cond:L=>{let e=f(L);return e.some(t=>e.some(s=>t.id<s.id&&I(L,t.id,s.id)<30))&&D(L).some(t=>t.stats.stability<=35)},run:(L,e)=>{let t=f(L),s=null;for(let o of t)for(let n of t)!s&&o.id<n.id&&I(L,o.id,n.id)<30&&(s=[o,n]);let a=g1(L,o=>o.stats.stability<=35);a&&(e.fx(["who.stability-l"],{who:a}),e.spark("civilwar",a));for(let o of s)e.fx(["who.fiscal-s"],{who:o.id});e.say(`${s[0].name}と${s[1].name}が、それぞれ別の勢力に武器を送っている。`)},ins:["P116","P117"],text:"大国どうしは直接戦わない。代わりに、小さな国の中で、それぞれの味方に戦わせる。"},{id:"E121",name:"独立運動",cat:"dom",w:15,cond:L=>Object.values(L.backs).some(e=>e.owner),who:L=>Object.values(L.backs).find(e=>e.owner).owner,run:(L,e,t)=>{let s=Object.values(L.backs).find(a=>a.owner===t);e.fx(["who.stability-m","who.guerrilla+m"],{who:t}),e.rng()<.5&&(s.owner=null,s.stats.stability=40,e.chron(`${s.name}、${L.majors[t].name}から独立`))},ins:["P106","P44"],text:"{who}に併合された土地で、独立を求める声が上がっている。力で手に入れたものは、力で取り返される。"},{id:"E122",name:"大飢饉",cat:"fw",w:6,repeat:15,cond:L=>D(L).some(e=>e.stats.food<=30),who:L=>E(D(L),e=>-e.stats.food).id,run:(L,e,t)=>e.spark("famine",t),ins:["P31","P114"],text:"{who}で、作物が実らず、食べ物の配給が止まった。"},{id:"E123",name:"緑の革命",cat:"fw",w:30,coop:!0,cond:L=>L.flags.gmo!=null&&(L.counters.foodAid||0)>=3,fx:["poorBg.food+l","world.foodPrice-m","world.trust+s"],text:"新しい品種と農業技術が、貧しい国々に広まった。何億人分もの食べ物が、新しく生まれた。"},{id:"E124",name:"宗教革命",cat:"dom",w:8,cond:L=>f(L).some(e=>e.stats.ethnic>=65&&e.stats.stability<=35),who:L=>f(L).find(e=>e.stats.ethnic>=65&&e.stats.stability<=35).id,run:(L,e,t)=>{e.collapse(t,"宗教革命"),e.rename(t,"revolution")},text:"{who}で、宗教指導者を掲げた革命が起きた。王宮は空になり、国のかたちが変わる。"},{id:"E125",name:"戦後の復興援助",cat:"dip",w:30,coop:!0,cond:L=>(L.counters.lowAid||0)>=5&&w1(L,"E12"),fx:["bgAll.econ+m","world.trust+m","world.conflicts-m"],text:"戦争の後、勝った国も負けた国も、まとめて立て直す援助が始まった。復讐より復興を選んだわけだ。"},{id:"E126",name:"酸性雨",cat:"env",w:8,cond:L=>Y(L,"industry")>=65,run:(L,e)=>{for(let t of f(L))t.stats.industry>=70&&e.fx(["who.forest-s"],{who:t.id})},fx:["world.forestRes-s","world.biodiv-s"],ins:["P91"],text:"工場の煙が雨に溶けて、遠くの国の森を枯らしている。煙を出した国と、森を失う国は違う国だ。"},{id:"E127",name:"農薬の公害",cat:"env",w:6,cond:L=>f(L).some(e=>e.stats.food>=120),who:L=>E(f(L),e=>e.stats.food).id,fx:["who.stability-s","world.biodiv-m"],ins:["P97"],text:"{who}の畑にまかれた農薬で、春になっても鳥が鳴かなくなった。"},{id:"E128",name:"化学工場の大事故",cat:"disaster",w:5,cond:L=>P(L)>=5,who:L=>g1(L,e=>e.stats.econ>=20),run:(L,e)=>e.deaths(.02),fx:["who.stability-m"],text:"{who}の化学工場から毒ガスが漏れた。工場の持ち主は外国の会社で、責任の所在がはっきりしない。"},{id:"E129",name:"静かな感染症",cat:"health",w:6,cond:L=>P(L)>=4&&D(L).some(e=>e.region==="me"&&e.stats.stability<=40),fx:["poorBg.stability-s"],run:(L,e)=>e.deaths(1),ins:["P110","P81"],text:"ゆっくりと、しかし確実に広がる感染症がある。働き盛りの大人が倒れ、子どもだけが残される村が増えている。"},{id:"E130",name:"システムの日付問題",cat:"tech",w:6,cond:L=>L.flags.internet!=null,run:(L,e)=>{for(let t of f(L))t.flags.cyber||e.fx(["who.gnp-s"],{who:t.id})},ins:["P87"],text:"古いコンピュータが、日付の桁を数え間違えるかもしれない。備えた国には何も起きず、備えなかった国では銀行が止まった。"},{id:"E131",name:"人間を超える人工知能",cat:"future",w:15,cond:L=>P(L)>=20&&f(L).some(e=>e.stats.tech>=96),who:L=>E(f(L),e=>e.stats.tech).id,run:(L,e,t)=>{for(let s of f(L))s.id!==t&&e.addRel(t,s.id,-10);L.flags.automation=L.year},fx:["who.industry+l","who.tech+m","world.tension+m"],ins:["P103","P102"],next:["E132"],text:"{who}で、人間より賢い機械が生まれたらしい。その機械が、誰の命令を聞くのかはまだわからない。"},{id:"E132",name:"仕事の自動化と大量失業",cat:"future",w:12,cond:L=>w1(L,"E77")||L.flags.automation!=null,run:(L,e)=>{L.flags.automation=L.year;for(let t of f(L))t.stats.tech>=70&&e.fx(["who.inequality+m","who.stability-s"],{who:t.id})},ins:["P103","P10"],text:"機械が仕事を覚えるたびに、人間の仕事が一つ消えていく。生産は増えたのに、生活は苦しくなった人が多い。"},{id:"E133",name:"気候工学をめぐる対立",cat:"future",w:12,cond:L=>L.world.co2>=62&&Y(L,"tech")>=65,run:L=>{L.flags.geoeng=L.year},ins:["P104","P91"],text:"空に細かい粒をまけば、地球を冷やせる。だが雨の降り方が変わる。冷やしたい国と、雨を失う国が、同じ空の下にいる。さて、どうする？"},{id:"E134",name:"月の資源争奪",cat:"future",w:10,cond:L=>(L.counters.space||0)>=2,run:(L,e)=>{let t=f(L).filter(s=>s.stats.tech>=80);for(let s of t)e.fx(["who.fiscal-s","who.tech+s"],{who:s.id})},fx:["world.tension+s"],ins:["P90","P107"],text:"月の土の中に、未来の燃料が眠っているらしい。旗を立てた者のものになるのかね？"},{id:"E135",name:"宇宙軍の創設",cat:"future",w:8,cond:L=>Y(L,"tech")>=75&&L.world.tension>=50,fx:["world.tension+m"],ins:["P107","P102"],text:"陸、海、空に続いて、宇宙にも軍隊ができた。戦場は、また一つ広がった。"},{id:"E136",name:"海底資源の採掘",cat:"future",w:10,cond:L=>Y(L,"tech")>=68&&L.world.oilRes<=62,run:L=>{L.flags.seabed=L.year},ins:["P108","P97"],text:"深い海の底から、金属と燃料を掘り出す技術ができた。まだ誰も見たことのない生き物が、そこに棲んでいるのだがね。"},{id:"E137",name:"暗号が破られる日",cat:"future",w:10,cond:L=>f(L).some(e=>e.stats.tech>=95),who:L=>E(f(L),e=>e.stats.tech).id,run:(L,e,t)=>{for(let s of f(L))s.id!==t&&!s.flags.cyber&&e.fx(["who.security-m","who.capital-s"],{who:s.id})},fx:["world.tension+m"],ins:["P87"],text:"{who}の新しい計算機が、世界中の暗号を数秒で解けるらしい。銀行も軍隊も、鍵をかけ直さなければならない。"},{id:"E138",name:"核融合の実用化",cat:"future",w:15,cond:L=>P(L)>=15&&f(L).some(e=>e.stats.tech>=94),who:L=>E(f(L),e=>e.stats.tech).id,run:(L,e)=>{for(let t of f(L))t.stats.oil>=60&&e.fx(["who.fiscal-m","who.gnp-s"],{who:t.id})},fx:["who.altE+l","who.gnp+m","world.co2-m"],text:"{who}で、海の水から無限に近いエネルギーを取り出す炉が動き出した。石油の時代が、終わりかけている。"},{id:"E139",name:"遺伝子編集ベビー",cat:"future",w:8,cond:L=>f(L).reduce((e,t)=>e+t.stats.patents,0)>=100,who:L=>E(f(L),e=>e.stats.patents).id,fx:["who.rep-m","world.trust-s"],ins:["P71"],text:"{who}の研究所で、遺伝子を書き換えた子どもが生まれた。病気に強い子だという。次は、頭の良い子を注文できるようになるのかね。"},{id:"E140",name:"寿命を延ばす治療",cat:"future",w:8,cond:L=>P(L)>=20&&Y(L,"tech")>=75,run:(L,e)=>{for(let t of f(L))t.stats.tech>=80&&e.fx(["who.inequality+m"],{who:t.id})},fx:["world.trust-s"],text:"寿命を二十年延ばす治療ができた。ただし、とても高い。長生きできるかどうかは、財布しだいになった。"},{id:"E141",name:"国土のない国家",cat:"future",w:30,coop:!0,cond:L=>Object.values(L.backs).some(e=>e.sunk)&&L.world.trust>=55,fx:["world.trust+m","world.refugees-m"],text:"海に沈んだ国が、国民の名簿と文化をネットの上に残し、国土のない国として認められた。国とは何かを、世界が考え直すきっかけになった。"},{id:"E142",name:"デジタル通貨の覇権争い",cat:"future",w:10,cond:L=>L.flags.internet!=null&&P(L)>=12,run:L=>{L.flags.digitalCurrency=L.year},ins:["P109","P84"],text:"国が発行する電子のお金が、国境を越えて使われ始めた。どの国のお金が世界の標準になるかで、静かな戦争が起きている。"},{id:"E143",name:"消えゆく国",cat:"future",w:8,cond:L=>f(L).some(e=>e.flags.aging&&L.year-e.flags.aging>=10),who:L=>f(L).find(e=>e.flags.aging&&L.year-e.flags.aging>=10).id,fx:["who.industry-m","who.pop-s","who.fiscal-s"],ins:["P42"],text:"{who}では、村が一つずつ地図から消えている。このままでは、いつか国そのものがなくなる計算になる。"},{id:"E144",name:"未知の病原体",cat:"health",w:4,repeat:15,cond:L=>P(L)>=5&&!L.flags.pandemic,who:L=>g1(L,e=>e.stats.stability<=50)||g1(L,()=>!0),run:(L,e,t)=>e.spark("disease",t),ins:["P110","P111"],text:"{who}で、原因のわからない肺炎が広がっている。まだ名前もない病気だ。"},{id:"E145",name:"巨大な太陽フレア",cat:"disaster",w:3,cond:L=>P(L)>=10,run:(L,e)=>{for(let t of f(L))t.stats.tech>=75&&!t.flags.cyber&&e.fx(["who.gnp-m"],{who:t.id})},text:"太陽で巨大な爆発が起き、地球の電力網と衛星が一斉に止まった。電気に頼る国ほど、被害が大きい。"},{id:"E146",name:"小惑星の接近",cat:"disaster",w:2,cond:L=>P(L)>=15,who:L=>g1(L,()=>!0),run:(L,e,t)=>e.spark("asteroid",t),ins:["P105"],text:"巨大な小惑星が地球に向かっている。落ちる場所は{who}のあたりらしい。軌道を変えるには、一国の技術では足りない。"},{id:"E147",name:"超巨大火山の噴火",cat:"disaster",w:1,cond:L=>P(L)>=20,fx:["world.foodPrice+l","majors.food-m","world.co2-m"],run:(L,e)=>e.deaths(2),ins:["P31"],text:"大陸の真ん中にある超巨大火山が噴火した。空が灰に覆われ、数年は夏が来ない。"},{id:"E148",name:"一国の銀行破綻",cat:"eco",w:4,repeat:15,cond:L=>P(L)>=4,who:L=>{let e=f(L).filter(t=>t.stats.debt>=120||t.stats.capital<=30);return e.length?e[0].id:g1(L,t=>t.stats.econ>=25&&t.stats.debt>=60)},run:(L,e,t)=>e.spark("finance",t),ins:["P112","P113"],text:"{who}の大手銀行が破綻した。世界中の銀行が、その銀行にお金を貸している。"},{id:"E149",name:"内戦の勃発",cat:"dom",w:5,repeat:12,cond:L=>D(L).some(e=>e.stats.stability<=20),who:L=>E(D(L),e=>-e.stats.stability).id,run:(L,e,t)=>e.spark("civilwar",t),ins:["P116","P117"],text:"{who}で、政府軍と反政府勢力の内戦が始まった。"}];var M2=[{id:"E01",name:"危機の世界",cat:"start",w:0,cond:L=>L.year===1,text:"{year}年。世界の七十カ所で紛争が続き、エネルギー資源の枯渇は目前。条約の六割はとうに賞味期限切れだ。まずは自分の国を豊かにしてみたまえ。さて、どうする？"},{id:"E02",name:"核開発国の出現",cat:"mil",w:50,repeat:4,cond:L=>o1(L,"newNuke")<=1,who:L=>L.newNukeId,fx:["world.tension+l","who.rep-m"],run:(L,e,t)=>{for(let s of f(L))s.id!==t&&e.addRel(s.id,t,-15)},ins:["P54","P24","P65"],next:["E29","E58"],text:"{who}が核を手にした。お隣が持てば、自分も欲しくなる。そういうふうに世界はできている。さて、どうする？"},{id:"E03",name:"代替エネルギーブーム",cat:"eco",w:30,cond:L=>o1(L,"altE")<=3,fx:["world.foodPrice+l","bgAll.food-s"],ins:["P22","P30"],next:["E04","E06"],text:"新エネルギーのおかげで、大豆やトウモロコシ、パームの需要が倍増した。燃料になる作物は、食べ物でもあるのだがね。"},{id:"E04",name:"食糧危機",cat:"fw",w:20,repeat:10,cond:L=>L.world.foodPrice>=75,fx:["poorBg.food-m","poorBg.stability-m","world.refugees+m"],run:(L,e)=>e.deaths(1.5),ins:["P31","P14"],next:["E05","E09"],text:"貧しい国の主食が、豊かな国の燃料に変わった。食べ物の値段が跳ね上がり、飢えが広がっている。さて、どうする？"},{id:"E05",name:"食糧特許問題",cat:"fw",w:30,cond:L=>L.flags.gmo!=null,who:L=>E(f(L),e=>e.stats.patents).id,fx:["who.gnp+s","who.rep-s","poorBg.econ-s"],ins:["P53","P71"],next:["E23"],text:"{who}の改良穀物には特許が付いている。畑に植えるたびに使用料が要る。昔から育ててきた作物まで、気づけば他国の権利になっていた。"},{id:"E06",name:"森林の枯渇",cat:"env",w:20,cond:L=>L.world.forestRes<=50,fx:["world.co2+s","bgAll.econ-s"],ins:["P91"],next:["E22","E51"],text:"森がものすごい速さで消えている。木材も紙も足りなくなり、森に棲んでいた生き物は、名前だけが図鑑に残った。"},{id:"E07",name:"開発援助バブル",cat:"eco",w:25,cond:L=>(L.counters.aidHigh||0)>=2,fx:["world.wrate+m","majors.capital+s"],ins:["P01","P52"],next:["E08"],text:"高い金利の開発援助に、世界中の資本が群がっている。泡は、ふくらんでいる間がいちばん美しい。"},{id:"E08",name:"援助先の連鎖破綻",cat:"eco",w:30,cond:L=>w1(L,"E07")&&D(L).filter(e=>e.stats.debt>=80).length>=3,run:(L,e)=>{for(let t of D(L))t.stats.debt>=80&&(t.stats.econ=Math.max(0,t.stats.econ-15),t.stats.stability=Math.max(0,t.stats.stability-15));for(let t of f(L))t.stats.capital>=70&&e.fx(["who.capital-m","who.rep-s"],{who:t.id});L.flags.hate=L.year,e.deaths(.5)},fx:["world.refugees+m","world.tension+s"],ins:["P53"],next:["E09","E14"],text:"高金利で貸し付けた国々が、ばたばたと破綻した。返せない借金と一緒に残ったのは、貸した国への憎しみだ。"},{id:"E09",name:"内乱と宗教戦争",cat:"dom",w:15,repeat:6,cond:L=>f(L).some(e=>e.stats.stability<=35),who:L=>E(f(L),e=>-e.stats.stability).id,fx:["who.stability-m","who.guerrilla+m","world.conflicts+m"],run:(L,e,t)=>{L.majors[t].stats.stability<18&&e.rng()<.5&&e.collapse(t,"軍事クーデター")},ins:["P44","P43"],next:["E15","E17"],text:"{who}で経済の不安が内乱に、内乱が宗教戦争に変わりつつある。政情不安を呼べば、軍が動く。さて、どうする？"},{id:"E10",name:"報道",cat:"misc",w:0,repeat:10,cond:L=>L.kid?L.year%4===0:L.year%10===0,run:(L,e)=>{let t=f(L);if(!t.length)return;let s=e.pick(t),a=e.pick(t);e.fx(["who.gnp+m"],{who:s.id}),e.fx(["who.stability-m"],{who:a.id}),e.say(`希望の知らせは${s.name}に、失望の知らせは${a.name}に届いた。`)},text:"十年ぶりの総括報道だ。希望と失望が、同時にやってくる。"},{id:"E11",name:"極地の地下資源",cat:"res",w:40,cond:L=>L.world.ice<=66,run:L=>{L.flags.polarOil=L.year},ins:["P21","P20"],next:["E12"],text:"氷が解けて、その下から巨大な石油資源が顔を出した。誰のものでもない土地に、誰もが欲しがるものが現れたわけだ。さあ、どうする？"},{id:"E12",name:"南極戦争",cat:"mil",w:40,cond:L=>f(L).some(e=>e.flags.polar)&&f(L).filter(e=>e.polar).length>=2,run:(L,e)=>{let t=f(L).filter(s=>s.flags.polar||s.polar);for(let s of t){e.fx(["who.soldiers-m","who.fiscal-m"],{who:s.id});for(let a of t)a.id<s.id&&e.addRel(s.id,a.id,-20)}L.flags.polarWar=L.year,e.deaths(.3)},fx:["world.conflicts+l","world.tension+l"],ins:["P61","P55","P63"],next:["E13"],text:"極地の石油をめぐって、ついに撃ち合いが始まった。氷の上の戦争は、補給が続くかぎり終わらない。さて、どうする？"},{id:"E13",name:"双極戦争",cat:"mil",w:30,cond:L=>b2(L,"E12")>=2&&b2(L,"E12")<10&&L.world.tension>=60,run:(L,e)=>{for(let t of f(L).filter(s=>s.flags.polar||s.polar))e.fx(["who.fiscal-l","who.stability-s"],{who:t.id});L.flags.twinWar=L.year,e.deaths(1)},fx:["worl xt:["E04"],text:"空を覆うほどのバッタの群れが、{who}の畑を食い尽くした。飢饉はすぐそこだ。"},{id:"E55",name:"沈む島国",cat:"env",w:15,cond:L=>L.world.ice<=60,who:L=>L.backs.B29&&!L.backs.B29.sunk?"B29":"B30",run:(L,e,t)=>{let s=L.backs[t];s.sunk=!0,s.stats.stability=0,s.stats.econ=0,e.chron(`${s.name}、海面上昇で国土を失う`)},fx:["world.refugees+l"],ins:["P42","P91"],next:["E19"],text:"海面上昇で、{who}が国土を失った。国がなくなっても、国民はなくならない。"},{id:"E56",name:"空の穴の修復",cat:"env",w:40,coop:!0,cond:L=>f(L).filter(e=>e.laws?.envTreaty).length>=3,fx:["world.co2-m","world.trust+m"],text:"環境条約を結んだ国々の努力で、空に開いた穴がふさがり始めた。やればできるという証拠だよ。"},{id:"E57",name:"海を覆うプラスチック",cat:"env",w:6,cond:L=>Y(L,"industry")>=62&&P(L)>=8,fx:["majors.food-s","bgAll.food-s"],ins:["P91"],text:"海の魚の腹の中から、ゴミが見つかるようになった。規制するか、見なかったことにするか。"},{id:"E58",name:"島の海峡危機",cat:"mil",w:15,cond:L=>L.world.tension>=52&&x2(L,35)!=null,fx:["world.tension+l"],ins:["P55","P54"],next:["E29"],text:"核保有国が、敵の目と鼻の先に核を運び込んだ。十三日間のにらみ合いになるぞ。外交で回避できるかね？"},{id:"E59",name:"壁の崩壊",cat:"dip",w:8,cond:L=>P(L)>=8&&f(L).some(e=>e.region==="eu"&&e.stats.stability>=60),who:L=>E(f(L).filter(e=>e.region==="eu"),e=>e.stats.stability).id,fx:["who.fiscal-m","who.stability+m","who.gnp+s"],run:(L,e,t)=>e.rename(t,"unify"),ins:["P50"],next:["E20"],text:"分断の象徴だった壁が崩れ、{who}は一つになった。統一の喜びと、統一の請求書が、同時に届く。"},{id:"E60",name:"超大国の解体",cat:"dom",w:20,cond:L=>f(L).some(e=>e.stats.nuke>=4&&e.stats.stability<=28&&e.stats.fiscal<=-6),who:L=>f(L).find(e=>e.stats.nuke>=4&&e.stats.stability<=28&&e.stats.fiscal<=-6).id,fx:["who.soldiers-l","who.gnp-m"],run:(L,e,t)=>{L.flags.looseNukes=L.year,L.looseNukesId=t,e.rename(t,"breakup")},next:["E61"],text:"{who}が解体した。地図は描き直され、核のありかは曖昧になった。"},{id:"E61",name:"行方不明の核",cat:"mil",w:40,cond:L=>o1(L,"looseNukes")<=2,who:L=>L.looseNukesId,run:(L,e,t)=>e.spark("looseNuke",t),fx:["world.tension+l","majors.guerrilla+s"],ins:["P24"],next:["E14","E29"],text:"解体のどさくさで、核物質が闇市場に流れた。テロ組織が核を持つ。最悪の想像が、最悪の現実になりかけている。"},{id:"E62",name:"民主化の連鎖",cat:"dom",w:15,cond:L=>f(L).some(e=>(e.flags.censor||0)>=2&&e.sta s[o]&&!L.backs[o].owner&&L.backs[o].stats.stability<=50),a=E(s,o=>-L.backs[o].stats.stability);e.war(t,a,e.rng()<.55?"ok":"ng")},fx:["world.foodPrice+m"],ins:["P54","P64","P55"],next:["E31","E04"],text:"{who}が隣国に軍を進めた。制裁か、武器の支援か、停戦の仲介か。さて、どうする？"},{id:"E67",name:"油田の炎上",cat:"mil",w:30,cond:L=>o1(L,"oilWar")<=1,fx:["world.co2+m","world.oilRes-s"],ins:["P61"],next:["E22"],text:"撤退する軍が、油田に火を放っていった。黒い煙が空を覆い、石油が空に燃えていく。"},{id:"E68",name:"存在しない兵器",cat:"mil",w:8,cond:L=>L.world.tension>=55&&y2(L).some(e=>e.stats.soldiers>=80),who:L=>E(y2(L),e=>e.stats.soldiers).id,fx:["world.tension+m","who.rep-s"],run:L=>{L.flags.wmd=L.year},ins:["P70","P71"],text:"{who}が「あの国は大量破壊兵器を隠している」と言い出した。証拠はまだない。疑惑だけで戦争を始めた国は、歴史上いくつもあるがね。"},{id:"E69",name:"海の上の要塞",cat:"mil",w:8,cond:L=>L.world.tension>=45&&P(L)>=6&&f(L).some(e=>e.region==="as"),who:L=>L.majors.M12?.panel?"M12":E(f(L).filter(e=>e.region==="as"),e=>e.stats.soldiers).id,fx:["who.bases+s","world.tension+m"],ins:["P71","P61"],next:["E21"],text:"{who}が海の上に人工の島を造り、基地を置いた。地図に載っていない島をめぐって、周辺国が衝突寸前だ。"},{id:"E70",name:"海賊の海",cat:"mil",w:10,repeat:10,cond:L=>L.backs.B19&&L.backs.B19.stats.stability<=20,run:(L,e)=>{for(let t of f(L))t.stats.mobility>=60&&e.fx(["who.gnp-s"],{who:t.id})},ins:["P61","P53"],text:"破綻した国の沖で、海賊が輸送船を襲っている。食えない国の若者が、銃を持って海に出た結果だ。"},{id:"E71",name:"球技の戦争",cat:"mil",w:3,cond:L=>P(L)>=5,run:(L,e)=>{let t=e.pick(D(L));e.fx(["who.stability-m"],{who:t.id}),e.say(`発端は${t.name}と隣国のサッカーの試合だった。`)},fx:["world.conflicts+s"],ins:["P55"],text:"国際大会の試合をきっかけに、本当の戦争が始まった。冗談のようだが、冗談ではない。"},{id:"E72",name:"差別政策の撤廃",cat:"dom",w:40,coop:!0,cond:L=>(L.counters.sanction||0)>=2&&L.flags.harmony!=null,fx:["world.trust+m","majors.ethnic-s"],text:"長い制裁と融和の努力の末に、一つの国が差別の制度を捨てた。世界は、ときどき良い方へ動く。"},{id:"E73",name:"世界をつなぐ網",cat:"tech",w:15,cond:L=>P(L)>=4&&f(L).filter(e=>e.stats.tech>=80).length>=3,run:L=>{L.flags.internet=L.year},fx:["majors.literacy+s","majors.mobility+s"],next:["E62","E74"],text:"世界中の端末が一つの網でつながった。知識は速く広がり、統制は効きにくくなる。良くも悪くも。"},{id:" かになるし、下手に使えば……まあ、それも経験だ。","{name}の元首に就任おめでとう。最初に言っておこう。このゲームで君が守るべきなのは、自分の国だけではない。"]},"setup.reroll":{pri:1,lines:["気に入らないか。いいだろう、一度だけ引き直させてやる。現実の元首は、生まれる国を選べないがね。","引き直しか。贅沢な元首だ。だが一度きりだぞ。"]},"year.start":{pri:2,lines:["{year}年。世界はまだ持ちこたえている。さて、どうする？","{year}年だ。パネルを見たまえ。数字は嘘をつかない。","一巡して、また一年が過ぎた。{year}年。","{year}年。昨年の選択の請求書が、そろそろ届くころだ。"]},"turn.player":{pri:3,lines:["君の番だ。選択肢はいくつもあるように見えて、実はそう多くない。","さあ、{name}の元首殿。どれを選ぶ？","確率をよく見ることだ。だが確率だけで決めると、たいてい後悔する。"]},"dice.crit":{pri:1,lines:["大成功だ！ {p}%の確率で、これ以上ない結果を引き当てた。","見事だ。世界はときどき、こういう気前のいい冗談を言う。","大成功。実に強運だ。強運が身につくものなら、だがね。"]},"dice.lowcrit":{pri:1,lines:["{p}%を一発で当てたか……！ 普通なら何十回も失敗するところだぞ。","{p}%だぞ？ 計算した私のほうが驚いている。"]},"dice.ok":{pri:3,lines:["成功だ。次の一手がもっと難しくなるがね。","成功。まずまずだ。","うまくいった。喜ぶのはいいが、隣の国の顔も見ておきたまえ。"]},"dice.partial":{pri:3,lines:["やや成功、といったところだ。思ったほどの効き目はない。","半分だけ、うまくいった。残りの半分は副作用だ。"]},"dice.ng":{pri:2,lines:["失敗だ。ダイスに文句を言っても、国民は戻らないぞ。","失敗。世界はそんなに甘くない。","失敗だ。確率とは、そういうものだ。"]},"dice.fumble":{pri:1,lines:["……見事なまでの大失敗だ。年表に残るぞ。","大失敗。これはまた、とんでもないことになった。","大失敗だ。顔色が変わったな。無理もない。"]},"player.nuclear":{pri:1,lines:["念のため言っておくが、核戦争が起きたらそこでゲームオーバーだ。","核か。持った瞬間から、君の国は世界中の標的リストに載る。"]},"player.war":{pri:1,lines:["宣戦布告か。武力で得たものは、武力でしか守れないぞ。","戦争を選んだな。世界を征服したら、それもゲームオーバーだということは忘れずに。"]},"player.selfish":{pri:2,lines:["合理的だ。隣の国も同じことを考えているだろうな。","自国のためだ、と言えば何でも正当化できる。そう信じている元首は多い。","なるほど。その利益は、どこかの国の損失でできているがね。"]},"player.coop":{pri:3,lines:["協調路線か。地味だが、それが一番遠くまで行ける道かもしれない。","手を結ぶ相手を選ぶのも、元首の仕事だ。"]},"ai.collapsed":{pri:1,lines:["{name}のパネルが消えた。しばらく席は空いたままだ。","{name}が崩壊した。泣くことはない。いつか新しい元首が立つ。"]},"player.collapsed":{pri:1,lines:["君の国は君の手を離れた。見ているがいい、世界は止まらない。","パネルがオフになったな。しばらくお休みだ。他国が手を差し伸べてくれれば、早く戻れるかもしれない。"]},recovered:{pri:1,lines:["{name}に新しい元首が立った。パネルが復活だ。","{name}が国政に復帰した。ただし、数字は崩壊したときのままだぞ。"]},"world.env":{pri:1,lines:["誰も望んでいないのに、こうなる。地球環境が限界に近づいている。","森が消え、氷が解け、水が干上がっていく。このままでは地球環境が破綻してゲームオーバーだ。"]},"world.tension":{pri:1,lines:["世界の緊張が高まっている。誰かが引き金に指をかけている音がするだろう？","一触即発だ。こういうとき、元首の器が試される。"]},"stage.up":{pri:1,lines:[
