<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="アルカナンバー">
<meta name="theme-color" content="#0b0912">
<title>アルカナンバー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="boot" style="position:fixed;left:16px;right:16px;top:44%;z-index:999;text-align:center;color:#a99e88;font:700 18px/1.6 sans-serif">よみこみちゅう…</div>
<script>
// iPad には コンソールが ないので、よみこみに しっぱいしたら りゆうを がめんに だす
(function () {
  function show(msg) {
    var b = document.getElementById('boot');
    if (!b || window.__bootDone) return;
    b.style.color = '#ff8a9a';
    b.textContent = 'うまく よみこめませんでした：' + msg;
  }
  window.addEventListener('error', function (e) { show((e.message || 'error') + (e.lineno ? '（' + e.lineno + ':' + e.colno + '）' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && (e.reason.message || e.reason))); });
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && !window.__bootDone && b.textContent.indexOf('：') < 0) b.textContent += '（がめん ' + innerWidth + '×' + innerHeight + '）';
  }, 6000);
})();
</script>
<div id="stage"></div>
<div class="rotate-hint"><div class="ph">📱</div><p>iPadを よこむきに してね</p><button data-portrait>このまま あそぶ</button></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
