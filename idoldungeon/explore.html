<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1530">
<title>迷宮探索 - アイドル迷宮（仮）</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="explore">
<header class="top bar">
  <h1><a href="./" class="back">←</a> <span id="where">街</span></h1>
  <div class="status"><span id="pos"></span><span id="zone"></span><span id="gold"></span></div>
</header>
<main class="ex-layout">
  <section class="ex-main">
    <div id="view-wrap" class="view-wrap">
      <canvas id="view" width="480" height="360" aria-label="迷宮の一人称視点"></canvas>
      <div id="town" class="town" hidden></div>
      <div id="battle" class="battle" hidden></div>
    </div>
    <div id="log" class="log" aria-live="polite"></div>
    <div id="pad" class="pad">
      <button data-a="strafeL" title="左へ横歩き (Q)">⇠</button>
      <button data-a="forward" title="前へ (↑ / W)">▲</button>
      <button data-a="strafeR" title="右へ横歩き (E)">⇢</button>
      <button data-a="turnL" title="左を向く (← / A)">↶</button>
      <button data-a="turnBack" title="後ろを向く (↓ / S)">⟲</button>
      <button data-a="turnR" title="右を向く (→ / D)">↷</button>
      <button data-a="search" class="wide" title="調べる (Space / F)">調べる</button>
      <button data-a="stairs" class="wide" id="stairs-btn" hidden>階段</button>
    </div>
  </section>
  <aside class="ex-side">
    <canvas id="map" width="264" height="264" aria-label="オートマップ"></canvas>
    <div id="party" class="ex-party"></div>
    <div id="bag" class="bag"></div>
  </aside>
</main>
<div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>
<script type="module" src="js/explore.js"></script>
</body>
</html>
