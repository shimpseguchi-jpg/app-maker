<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かたちづくり</title>
<!--
  かたちづくり（小学1年 算数「かたちづくり」の練習ゲーム）
  ・このファイル1つだけで動きます（外部の画像・フォント・ライブラリなし）。
  ・Google サイト：「挿入」→「埋め込む」→「コードを埋め込む」に、このファイルの中身をまるごと貼りつけてください。
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;touch-action:manipulation}
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo","Yu Gothic",system-ui,sans-serif;
  background:#e9f6ff;color:#333;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{max-width:1000px;margin:0 auto;padding:8px;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
header h1{font-size:clamp(18px,4vw,28px);margin:0;flex:1;display:flex;align-items:center;gap:8px}
header h1 .no{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:#3bb3a6;color:#fff;font-size:.8em}
.ibtn{font:inherit;font-size:16px;font-weight:bold;border:none;border-radius:12px;background:#fff;color:#2a8c82;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 #9cc}
.ibtn:active{transform:translateY(2px);box-shadow:none}
.btn{font:inherit;font-size:17px;font-weight:bold;padding:10px 14px;border-radius:14px;border:3px solid #2a8c82;background:#fff;color:#2a8c82;cursor:pointer;box-shadow:0 3px 0 #2a8c82}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:#2a8c82;color:#fff}
.btn.orange{border-color:#e8590c;color:#e8590c;box-shadow:0 3px 0 #e8590c}
.btn:disabled{opacity:.4}
.q{font-size:clamp(16px,2.6vw,22px);font-weight:bold;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:10px;border-left:8px solid #3bb3a6;line-height:1.5}
/* ホーム */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{background:#fff;border-radius:18px;padding:12px;cursor:pointer;border:4px solid transparent;box-shadow:0 4px 0 #b9dbe9;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mode:active{transform:translateY(3px);box-shadow:none}
.mode:hover{border-color:#3bb3a6}
.mode svg{width:100%;max-width:200px;height:110px}
.mode b{font-size:18px;word-break:keep-all}
.mode small{font-size:14px;color:#666}
.mode .prog{font-size:14px;color:#e8590c;font-weight:bold}
/* レベル（がくねん）えらび */
.grades{display:flex;flex-direction:column;gap:12px}
.grade{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:12px 16px;cursor:pointer;border:4px solid transparent;box-shadow:0 5px 0 #b9dbe9}
.grade:hover{border-color:#3bb3a6}
.grade:active{transform:translateY(3px);box-shadow:none}
.grade .gnum{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:#3bb3a6;color:#fff;font-size:36px;font-weight:900;display:grid;place-items:center}
.grade:nth-child(2) .gnum{background:#f08c3a}
.grade:nth-child(3) .gnum{background:#8a63d2}
.grade .gbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.grade .gbody b{font-size:clamp(20px,4vw,26px)}
.grade .gart{flex:0 0 110px;height:76px;display:grid;place-items:center}
.grade .gart svg{width:100%;height:100%}
.grade .prog{font-size:15px;color:#e8590c;font-weight:bold}
.grade.locked{background:#eef1f3;cursor:not-allowed;box-shadow:0 5px 0 #cfd6dc}
.grade.locked .gnum{background:#b8c0c6}
.grade.locked b{color:#8a959c}
.lockmsg{font-size:14px;color:#6b7780;font-weight:bold}
.lock{font-size:40px}
.bar{height:12px;border-radius:6px;background:#e3eef2;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#f08c3a);border-radius:6px}
.gcs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:220px}
.gc{font-size:12px;font-weight:bold;border-radius:10px;padding:2px 2px;white-space:nowrap;line-height:1.35;text-align:center;background:#e6f6f3;color:#2a8c82;border:2px solid #9fd8cf}
.gc.clear{background:#fff4d6;color:#c26a00;border-color:#ffcf6b}
.gc.off{background:#eef1f3;color:#8a959c;border-color:#d5dbe0}
.gchip{font-size:.55em;background:#fff;color:#2a8c82;border:2px solid #3bb3a6;border-radius:999px;padding:2px 10px;margin-left:6px}
.tag{font-size:12px;color:#fff;background:#f08c3a;border-radius:999px;padding:1px 8px}
.unlock{font-size:clamp(18px,4vw,22px);font-weight:bold;color:#2a8c82;background:#eafaf6;border-radius:14px;padding:10px 14px;margin:0 0 14px;line-height:1.6}
.unlock b{color:#e8590c}
.left{font-size:15px;color:#666;margin:-4px 0 12px}
/* ステージえらび */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.lv{position:relative;background:#fff;border-radius:16px;padding:8px;cursor:pointer;border:3px solid #cfe6ee;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:bold;font-size:16px}
.lv:active{transform:translateY(2px)}
.lv svg{width:100%;height:90px}
.lv .num{position:absolute;left:6px;top:4px;background:#3bb3a6;color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px}
.lv .star{position:absolute;right:6px;top:2px;font-size:22px}
/* あそぶ */
.play{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:center}
.boardWrap{flex:1 1 340px;max-width:620px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 0 #b9dbe9}
.boardWrap svg{display:block;width:100%;height:auto;max-height:calc(100vh - 160px);min-height:220px;touch-action:none;cursor:pointer}
.side{flex:0 1 270px;display:flex;flex-direction:column;gap:10px;min-width:220px}
.panel{background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 0 #b9dbe9}
.panel h3{margin:0 0 6px;font-size:16px;color:#2a8c82}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pal button{touch-action:none;aspect-ratio:1;cursor:grab;border:3px solid #ddd;border-radius:12px;background:#fff;padding:6px}
.pal button.on{border-color:#e8590c;background:#fff1e3}
.pal svg{width:100%;height:100%;display:block}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 auto}
.msg{min-height:1.5em;font-weight:bold;color:#e8590c;font-size:17px}
.count{font-size:18px;font-weight:bold}
.count big{font-size:26px;color:#e8590c}
.mini{width:100%;height:auto;max-height:200px;display:block}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:20;display:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.howto{font-size:14px;color:#666;margin-top:6px;line-height:1.6}
.blink{animation:blink .45s ease-in-out 4}
@keyframes blink{50%{opacity:.15}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* できた */
.overlay{position:fixed;inset:0;background:rgba(0,40,60,.35);display:grid;place-items:center;z-index:10;overflow:hidden}
.ok{background:#fff;border-radius:24px;padding:22px 26px;text-align:center;box-shadow:0 8px 0 #2a8c82;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.ok .big{font-size:clamp(36px,9vw,64px);font-weight:900;color:#e8590c;letter-spacing:.1em}
.ok .stars{font-size:40px;margin:4px 0 12px}
.ok .btns{justify-content:center}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.conf{position:absolute;top:-30px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid red;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* やりかた（チュートリアル） */
.tut{position:fixed;inset:0;z-index:15;background:rgba(0,40,60,.18)}
.tutBox{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:17;width:min(680px,calc(100% - 20px));background:#fff;border:4px solid #3bb3a6;border-radius:20px;padding:14px 16px 12px;box-shadow:0 6px 0 #2a8c82;display:flex;gap:12px;align-items:flex-start;animation:tutIn .3s ease-out}
.tutBox.top{bottom:auto;top:10px}
@keyframes tutIn{from{opacity:0}to{opacity:1}}
.tutFace{font-size:46px;line-height:1;flex:0 0 auto;text-align:center}
.tutFace small{display:block;font-size:12px;color:#2a8c82;font-weight:bold;margin-top:2px;white-space:nowrap}
.tutMain{flex:1;min-width:0}
.tutText{font-size:clamp(17px,2.6vw,21px);font-weight:bold;line-height:1.6;min-height:3.2em}
.tutNav{display:flex;align-items:center;gap:8px;margin-top:8px}
.tutDots{flex:1;color:#bbb;letter-spacing:4px;font-size:14px}
.tutDots b{color:#e8590c}
.tutNext{white-space:nowrap}
.tutSkip{white-space:nowrap;font:inherit;font-size:14px;background:none;border:none;color:#888;text-decoration:underline;cursor:pointer;padding:6px}
.tut-hl{position:relative;z-index:16;outline:5px solid #e8590c;outline-offset:3px;border-radius:14px;animation:hl 1s ease-in-out infinite}
@keyframes hl{50%{outline-color:rgba(232,89,12,.25)}}
@media (max-width:520px){
  .tutBox{padding:10px 10px 8px;gap:8px}
  .tutFace{font-size:32px}
  .tutFace small{display:none}
  .tutText{font-size:17px}
  .tutDots{letter-spacing:1px;font-size:11px;min-width:0}
  .tutNav{gap:4px}
  .tutNav .btn{font-size:15px;padding:8px 10px}
}
footer{margin-top:auto;padding-top:10px;text-align:center;font-size:12px;color:#7a9}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ibtn" id="backBtn" style="visibility:hidden">◀ もどる</button>
    <h1 id="title"><span class="no">14</span>かたちづくり</h1>
    <button class="ibtn" id="sndBtn" title="おと">🔊</button>
  </header>
  <main id="screen"></main>
  <footer>いろいた・ぼう・てんを つかって、いろいろな かたちを つくろう</footer>
</div>

<script>
(function(){
'use strict';

/* ===================== きほん ===================== */
var screen = document.getElementById('screen');
var titleEl = document.getElementById('title');
var backBtn = document.getElementById('backBtn');
var sndBtn = document.getElementById('sndBtn');
var COLORS = ['#f7a8b8','#fbe38a','#8fd3f5','#b5d957'];   // ピンク・きいろ・みずいろ・きみどり
var EDGE = '#555';
var backAction = null;

function h(s){ return s; }
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function svgPt(svg, e){
  var p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function gcd(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }

/* きろく（Google サイトの埋め込みで保存できないときは、そのあいだだけ覚える） */
var store = (function(){
  var KEY='katachi-v2', data={};
  try{ data = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
  return {
    get:function(m,i){ return !!(data[m] && data[m][i]); },
    set:function(m,i){ (data[m]=data[m]||{})[i]=1; try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} },
    n:function(m){ return data[m] ? Object.keys(data[m]).length : 0; }
  };
})();

/* おと（WebAudio でその場でつくる） */
var soundOn = true, actx = null;
function beep(freqs, dur, type){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var t0 = actx.currentTime;
    freqs.forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type = type || 'triangle'; o.frequency.value = f;
      var s = t0 + i*dur;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.18, s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(s); o.stop(s+dur+0.05);
    });
  }catch(e){}
}
var SFX = {
  put:function(){ beep([660],0.09); },
  pop:function(){ beep([392],0.08); },
  sel:function(){ beep([880],0.05); },
  ng:function(){ beep([240,200],0.13,'square'); },
  ok:function(){ beep([523,659,784,1047],0.13); }
};
sndBtn.onclick = function(){ soundOn=!soundOn; sndBtn.textContent = soundOn?'🔊':'🔇'; };
backBtn.onclick = function(){ if(backAction) backAction(); };

function setHeader(text, back){
  titleEl.innerHTML = text;
  backAction = back || null;
  backBtn.style.visibility = back ? 'visible' : 'hidden';
}

/* ===================== いろいた（さんかく）の しくみ =====================
   1つの ますを 2本の ななめ線で 4つに わけて（0:うえ 1:みぎ 2:した 3:ひだり）、
   いろいた（ますの はんぶんの さんかく）が どこを うめるかで くらべる。
   ◤=tl ◥=tr ◢=br ◣=bl（かどが ある ほう）。# は ます1つぶん（さんかく2まい）。 */
var Q = { tl:[0,3], tr:[0,1], br:[1,2], bl:[2,3] };
var ORI = ['br','bl','tr','tl'];
var CH = { '◤':'tl', '◥':'tr', '◢':'br', '◣':'bl' };
var TRI = { tl:[[0,0],[1,0],[0,1]], tr:[[0,0],[1,0],[1,1]], br:[[1,0],[1,1],[0,1]], bl:[[0,0],[1,1],[0,1]] };
function triPts(x,y,o){ return TRI[o].map(function(p){ return (x+p[0])+','+(y+p[1]); }).join(' '); }
function parseShape(rows, dx, dy){
  dx=dx||0; dy=dy||0;
  var pieces=[], w=0;
  rows.forEach(function(r,y){
    var cs = Array.from(r); w = Math.max(w, cs.length);
    cs.forEach(function(c,x){
      if(c==='#'){ pieces.push({x:x+dx,y:y+dy,o:'tl'},{x:x+dx,y:y+dy,o:'br'}); }
      else if(CH[c]){ pieces.push({x:x+dx,y:y+dy,o:CH[c]}); }
    });
  });
  return { pieces:pieces, w:w, h:rows.length };
}
function coverage(pieces){
  var m = {};
  pieces.forEach(function(p){ Q[p.o].forEach(function(q){ var k=p.x+','+p.y+','+q; m[k]=(m[k]||0)+1; }); });
  return m;
}
function sameCover(a,b){
  var A=coverage(a), B=coverage(b), ka=Object.keys(A), kb=Object.keys(B);
  if(ka.length!==kb.length) return false;
  return ka.every(function(k){ return A[k]===1 && B[k]===1; });
}
function quarterOf(fx,fy){
  var d1 = fy-fx, d2 = fy+fx-1;
  if(d1<0 && d2<0) return 0;
  if(d1<0) return 1;
  if(d2>=0) return 2;
  return 3;
}
function gridLines(W,H,color){
  var s='', c=color||'#b9c6d0';
  for(var x=0;x<=W;x++) s+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="'+c+'" stroke-width="0.02"/>';
  for(var y=0;y<=H;y++) s+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="'+c+'" stroke-width="0.02"/>';
  return s;
}
function piecesSvg(pieces, colorFn, sw){
  return pieces.map(function(p,i){
    return '<polygon points="'+triPts(p.x,p.y,p.o)+'" fill="'+colorFn(p,i)+'" stroke="'+EDGE+'" stroke-width="'+(sw||0.035)+'" stroke-linejoin="round"/>';
  }).join('');
}
function silhouetteSvg(pieces, fill){
  return pieces.map(function(p){
    return '<polygon points="'+triPts(p.x,p.y,p.o)+'" fill="'+fill+'" stroke="'+fill+'" stroke-width="0.03" stroke-linejoin="round"/>';
  }).join('');
}
function triIcon(o, fill){
  return '<svg viewBox="-0.1 -0.1 1.2 1.2"><polygon points="'+triPts(0,0,o)+'" fill="'+(fill||'#f7a8b8')+'" stroke="'+EDGE+'" stroke-width="0.05" stroke-linejoin="round"/></svg>';
}
function shapePreview(rows, colored){
  var S = parseShape(rows);
  var vb = '-0.2 -0.2 '+(S.w+0.4)+' '+(S.h+0.4);
  var body = colored ? piecesSvg(S.pieces, function(p,i){ return COLORS[i%4]; }, 0.05)
                     : silhouetteSvg(S.pieces, '#aab4be');
  return '<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet">'+body+'</svg>';
}

/* ===================== ドラッグの しくみ（いろいた） ===================== */
var ROT = ['tl','tr','br','bl'];   // タッチで みぎまわりに まわる じゅんばん
var ghostEl = null;
function showGhost(o, c, x, y, size){
  if(!ghostEl){ ghostEl = el('<div class="ghost"></div>'); document.body.appendChild(ghostEl); }
  ghostEl.innerHTML = '<svg viewBox="0 0 1 1" width="'+size+'" height="'+size+'" style="overflow:visible"><polygon points="'+triPts(0,0,o)+'" fill="'+c+'" stroke="'+EDGE+'" stroke-width="0.04" stroke-linejoin="round"/></svg>';
  ghostEl.style.left = x+'px'; ghostEl.style.top = y+'px'; ghostEl.style.display = 'block';
}
function hideGhost(){ if(ghostEl) ghostEl.style.display = 'none'; }
function fits(pieces, x, y, o, skip){
  return !pieces.some(function(a,i){
    return i!==skip && a.x===x && a.y===y && Q[a.o].some(function(k){ return Q[o].indexOf(k)>=0; });
  });
}
function hitPiece(pieces, p){
  var x = Math.floor(p.x), y = Math.floor(p.y), q = quarterOf(p.x-x, p.y-y);
  for(var i=pieces.length-1;i>=0;i--){ var a=pieces[i]; if(a.x===x && a.y===y && Q[a.o].indexOf(q)>=0) return i; }
  return -1;
}
function nextRot(pieces, i){
  var a = pieces[i], s = ROT.indexOf(a.o);
  for(var k=1;k<4;k++){ var o = ROT[(s+k)%4]; if(fits(pieces, a.x, a.y, o, i)) return o; }
  return null;
}
/* info: {o, c, offX, offY}  h: {start(), tap(), drop(cell or null), cancel()} */
function startDrag(e, svg, hg, W, H, info, h){
  e.preventDefault();
  if(e.currentTarget===svg){ try{ svg.setPointerCapture(e.pointerId); }catch(er){} }
  var sx = e.clientX, sy = e.clientY, moving = false;
  function snap(ev){
    var p = svgPt(svg, ev), x = Math.round(p.x-info.offX), y = Math.round(p.y-info.offY);
    return (x>=0 && y>=0 && x<W && y<H) ? [x,y] : null;
  }
  function mv(ev){
    if(!moving && Math.hypot(ev.clientX-sx, ev.clientY-sy) < 8) return;
    if(!moving){ moving = true; if(h.start) h.start(); }
    var size = svg.getScreenCTM().a;
    showGhost(info.o, info.c, ev.clientX - info.offX*size, ev.clientY - info.offY*size, size);
    var cell = snap(ev);
    hg.innerHTML = cell ? '<polygon points="'+triPts(cell[0],cell[1],info.o)+'" fill="#e8590c" fill-opacity="0.12" stroke="#e8590c" stroke-width="0.05" stroke-dasharray="0.12 0.08" stroke-linejoin="round"/>' : '';
    ev.preventDefault();
  }
  function end(){
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', cancel);
    hideGhost(); hg.innerHTML = '';
  }
  function up(ev){ end(); if(moving) h.drop(snap(ev)); else if(h.tap) h.tap(); }
  function cancel(){ end(); if(h.cancel) h.cancel(); }
  document.addEventListener('pointermove', mv, {passive:false});
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', cancel);
}

/* ===================== 1. いろいたで つくろう ===================== */
// がくねん（1ねんせい・2ねんせい・3ねんせい）ごとの もんだい
var TILE_G = [
  [ // 1ねんせい：ますめの せんが みえる
    { name:'しかく',   rows:['#'] },
    { name:'さんかく', rows:['◢◣'] },
    { name:'リボン',   rows:['◣◢','◤◥'] },
    { name:'おうち',   rows:['◢◣','##'] },
    { name:'さかな',   rows:['◢◣◢','◥◤◥'] },
    { name:'ふね',     rows:['.##.','◥##◤'] },
    { name:'おやま',   rows:['.◢◣.','◢##◣'] }
  ],
  [ // 2ねんせい：かたちの なかの せんが みえない
    { name:'ヨット',     rows:['..◣..','..#◣.','◥###◤'] },
    { name:'き',         rows:['.◢◣.','◢##◣','.##.'] },
    { name:'ちょうちょ', rows:['#◣◢#','#◤◥#'] },
    { name:'ねこ',       rows:['◣.◢','###','###'] },
    { name:'ロケット',   rows:['.◢◣.','.##.','.##.','◢##◣'] },

function playTile(li){
  var L = LV('tile')[li];
  var T = parseShape(L.rows);
  var W = Math.max(T.w+2, 6), H = Math.max(T.h+2, 4);
  var ox = Math.floor((W-T.w)/2), oy = Math.floor((H-T.h)/2);
  var target = parseShape(L.rows, ox, oy).pieces;
  var tcov = coverage(target);
  var placed = [], sel = 'br', ci = 0, done = false;

  setHeader('<span class="no">'+(li+1)+'</span>'+L.name, function(){ showLevels('tile'); });
  screen.innerHTML =
    '<div class="q">いろいたを ならべて、はいいろの かたちを つくりましょう。'+(L.hide?'<br><small style="color:#e8590c">かたちの なかの せんが ない よ。よく かんがえて ならべよう。</small>':'')+'</div>'+
    '<div class="play"><div class="boardWrap">'+
      '<svg id="bd" viewBox="-0.1 -0.1 '+(W+0.2)+' '+(H+0.2)+'">'+
        '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fffdf4"/>'+
        (L.hide ? gridLines(W,H)+silhouetteSvg(target, '#cdd5dc') : silhouetteSvg(target, '#cdd5dc')+gridLines(W,H))+
        '<g id="pg"></g><g id="hg"></g><g id="dg"></g>'+
      '</svg></div>'+
      '<div class="side">'+
        '<div class="panel"><h3>いろいた（ボードへ ドラッグ）</h3><div class="pal" id="pal"></div>'+
          '<div class="howto">・いろいたを ボードへ ひっぱって おく<br>・おいた いろいたも ひっぱって うごかせる<br>・タッチすると くるっと まわる<br>・ボードの そとへ だすと とれる</div></div>'+
        '<div class="panel"><div class="count" id="cnt"></div><div class="msg" id="msg"></div></div>'+
        '<div class="btns"><button class="btn orange" id="hint">💡 ヒント</button><button class="btn" id="clr">ぜんぶ とる</button></div>'+
      '</div></div>';

  var svg = document.getElementById('bd'), pg = document.getElementById('pg'), hg = document.getElementById('hg'), dg = document.getElementById('dg');
  var pal = document.getElementById('pal'), cnt = document.getElementById('cnt'), msgEl = document.getElementById('msg');
  function msg(t){ msgEl.textContent = t||''; }

  function drawPal(){
    pal.innerHTML = ORI.map(function(o){
      return '<button data-o="'+o+'" class="'+(o===sel?'on':'')+'">'+triIcon(o, COLORS[ci%4])+'</button>';
    }).join('');
  }
  function markPal(){
    Array.prototype.forEach.call(pal.children, function(b){ b.classList.toggle('on', b.getAttribute('data-o')===sel); });
  }
  function update(){
    pg.innerHTML = piecesSvg(placed, function(p){ return p.c; });
    placed.forEach(function(p,i){ if(p.drag) pg.children[i].setAttribute('opacity','0.25'); });
    cnt.innerHTML = 'ならべた かず：<big>'+placed.length+'</big> まい<br><span style="font-size:15px;color:#666">（ぜんぶで '+target.length+' まい つかうよ）</span>';
  }
  function afterChange(){
    update();
    if(!done && sameCover(placed, target)){
      done = true;
      setTimeout(function(){ celebrate('tile', li); }, 350);
    }
  }
  function placeNew(x, y, o){
    if(!fits(placed, x, y, o, -1)){ SFX.ng(); msg('そこには はいらないよ。むきを かえてみよう'); return false; }
    placed.push({x:x,y:y,o:o,c:COLORS[ci%4]}); ci++;
    SFX.put(); msg(''); drawPal(); afterChange(); return true;
  }

  // いろいたを ボードへ ドラッグ（タッチだけなら むきを えらぶ）
  pal.addEventListener('pointerdown', function(e){
    var b = e.target.closest('button'); if(!b || done) return;
    sel = b.getAttribute('data-o'); markPal();
    startDrag(e, svg, dg, W, H, {o:sel, c:COLORS[ci%4], offX:0.5, offY:0.5}, {
      tap:function(){ SFX.sel(); msg('ボードの ますを タッチしても おけるよ'); },
      drop:function(cell){ if(cell) placeNew(cell[0], cell[1], sel); }
    });
  });

  function removePiece(a){
    var k = placed.indexOf(a); if(k<0) return;
    placed.splice(k,1); SFX.pop(); msg('いろいたを とったよ'); afterChange();
  }
  svg.addEventListener('pointerdown', function(e){
    if(done) return;
    var p = svgPt(svg,e), x = Math.floor(p.x), y = Math.floor(p.y);
    if(x<0||y<0||x>=W||y>=H) return;
    var i = hitPiece(placed, p), empty = false;
    if(i<0){
      // ますの あいて いる ところ：タッチなら あたらしく おく／ひっぱったら その ますの いろいたを うごかす
      empty = true;
      placed.forEach(function(a,k){ if(a.x===x && a.y===y) i = k; });
      if(i<0){ e.preventDefault(); placeNew(x, y, sel); return; }
    }
    var a = placed[i];
    startDrag(e, svg, dg, W, H, {o:a.o, c:a.c, offX:p.x-a.x, offY:p.y-a.y}, {
      start:function(){
        a.drag = true; var n = pg.children[placed.indexOf(a)]; if(n) n.setAttribute('opacity','0.25');

      tap:function(){
        if(empty){ placeNew(x, y, sel); return; }

        if(!o){ SFX.ng(); msg('ここでは まわせないよ'); return; }
        a.o = o; SFX.sel(); msg(''); afterChange();
      },
      drop:function(cell){
        a.drag = false;
        if(!cell){ removePiece(a); return; }
        if(!fits(placed, cell[0], cell[1], a.o, placed.indexOf(a))){ SFX.ng(); msg('そこには はいらないよ'); update(); return; }
        a.x = cell[0]; a.y = cell[1]; SFX.put(); msg(''); afterChange();
      },
      cancel:function(){ a.drag = false; update(); }
    });
  });
  document.getElementById('clr').onclick = function(){ if(done) return; placed=[]; msg(''); update(); };
  document.getElementById('hint').onclick = function(){
    if(done) return;
    var bad = placed.filter(function(a){ return Q[a.o].some(function(k){ return !tcov[a.x+','+a.y+','+k]; }); })[0];
    if(bad){ flash(bad,'#ff3b30'); msg('かたちから はみだして いるよ'); return; }
    var cov = coverage(placed);
    var cands = target.concat([]);
    target.forEach(function(t){ ORI.forEach(function(o){ cands.push({x:t.x,y:t.y,o:o}); }); });
    for(var i=0;i<cands.length;i++){
      var c = cands[i];
      var ok = Q[c.o].every(function(k){ var key=c.x+','+c.y+','+k; return tcov[key] && !cov[key]; });
      if(ok){ flash(c,'#e8590c'); sel=c.o; markPal(); msg('ひかって いる ところに おいてみよう'); return; }
    }
    msg('いろいたを まわしたり うごかしたり してみよう');
  };
  function flash(p, color){
    hg.innerHTML = '<polygon class="blink" points="'+triPts(p.x,p.y,p.o)+'" fill="'+color+'" fill-opacity="0.35" stroke="'+color+'" stroke-width="0.08" stroke-linejoin="round"/>';
    setTimeout(function(){ hg.innerHTML=''; }, 1900);
  }
  drawPal(); update();
}

function shapeKey(pieces){
  var c = coverage(pieces), ks = Object.keys(c), mx = Infinity, my = Infinity;
  if(ks.some(function(k){ return c[k]!==1; })) return '';
  ks.forEach(function(k){ var a=k.split(','); mx=Math.min(mx,+a[0]); my=Math.min(my,+a[1]); });
  return ks.map(function(k){ var a=k.split(','); return (a[0]-mx)+','+(a[1]-my)+','+a[2]; }).sort().join(' ');
}

  function isMoved(p){ var s = start[p.id]; return !(p.x===s.x && p.y===s.y && p.o===s.o); }
  function movedCount(){ return pieces.filter(isMoved).length; }
  function reset(){
    pieces = start.map(function(p,i){ return {x:p.x,y:p.y,o:p.o,c:p.c,id:i}; });
    done = false;
    msg('うごかす いろいたを えらんでね'); update();
  }
  function update(){
    pg.innerHTML = piecesSvg(pieces, function(p){ return p.c; });
    var top = [];
    pieces.forEach(function(p,i){
      var n = pg.children[i];
      n.setAttribute('data-id', p.id);
      if(p.drag) n.setAttribute('opacity','0.25');
      if(isMoved(p) || p.drag){ n.setAttribute('stroke','#e8590c'); n.setAttribute('stroke-width','0.08'); top.push(n); }
    });
    top.forEach(function(n){ pg.appendChild(n); });   // うごかした いろいたを いちばん うえに
    cnt.innerHTML = 'うごかした かず：<big>'+movedCount()+'</big> / '+N+' まい';

  function afterChange(a){

      done = true; msg('');
      setTimeout(function(){ celebrate('move', li); }, 350);
    }else if(!isMoved(a)){ msg('もとに もどったよ。べつの いろいたも えらべるよ'); }
    else msg('');
  }
  svg.addEventListener('pointerdown', function(e){
    if(done) return;
    var p = svgPt(svg,e), i = hitPiece(pieces, p);
    if(i<0){
      var cx = Math.floor(p.x), cy = Math.floor(p.y);
      pieces.forEach(function(a,k){ if(a.x===cx && a.y===cy && (i<0 || isMoved(a))) i = k; });
      if(i<0) return;

      start:function(){ a.drag = true; var n = pg.querySelector('[data-id="'+a.id+'"]'); if(n) n.setAttribute('opacity','0.25'); },
      tap:function(){
        var o = nextRot(pieces, pieces.indexOf(a));

        a.x = cell[0]; a.y = cell[1]; SFX.put(); afterChange(a);
      },
      cancel:function(){ a.drag = false; afterChange(a); }
    });
  });
  document.getElementById('rst').onclick = reset;
  reset();
}

function polyToLines(polys){
  var out=[];
  polys.forEach(function(pl){ for(var i=0;i+1<pl.length;i++) out.push([pl[i],pl[i+1]]); });
  return out;
}
function unitKey(lines){
  var segs = {}, list=[];
  lines.forEach(function(ln){
    var a=ln[0], b=ln[1], dx=b[0]-a[0], dy=b[1]-a[1], g=gcd(Math.abs(dx),Math.abs(dy));
    if(!g) return;
    var sx=dx/g, sy=dy/g;
    for(var i=0;i<g;i++){
      var p=[a[0]+sx*i, a[1]+sy*i], q=[p[0]+sx, p[1]+sy];
      if(q[0]<p[0] || (q[0]===p[0] && q[1]<p[1])){ var t=p; p=q; q=t; }
      var k=p+'|'+q; if(!segs[k]){ segs[k]=1; list.push([p,q]); }
    }
  });
  if(!list.length) return '';
  var mx=Infinity, my=Infinity;
  list.forEach(function(s){ s.forEach(function(pt){ mx=Math.min(mx,pt[0]); my=Math.min(my,pt[1]); }); });
  return list.map(function(s){ return [s[0][0]-mx,s[0][1]-my,s[1][0]-mx,s[1][1]-my].join(','); }).sort().join(' ');
}
function dotsSvgContent(NX,NY,lines,color,sw){
  var s='';
  lines.forEach(function(l){ s+='<line x1="'+l[0][0]+'" y1="'+l[0][1]+'" x2="'+l[1][0]+'" y2="'+l[1][1]+'" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round"/>'; });
  for(var y=0;y<NY;y++) for(var x=0;x<NX;x++) s+='<circle cx="'+x+'" cy="'+y+'" r="0.09" fill="#45aee0"/>';
  return s;
}
function linesBox(lines){
  var mx=0,my=0; lines.forEach(function(l){ l.forEach(function(p){ mx=Math.max(mx,p[0]); my=Math.max(my,p[1]); }); });
  return [mx,my];
}

    '<div class="q">てんと てんを せんで つないで、'+(L.free?'いろいろな かたちを':'おてほんと おなじ かたちを')+' つくりましょう。</div>'+

        '<div class="btns"><button class="btn" id="undo">↶ ひとつ けす</button><button class="btn" id="clr">ぜんぶ けす</button>'+

      '</div></div>';

  var svg=document.getElementById('bd'), lg=document.getElementById('lg'), sg=document.getElementById('sg'), rub=document.getElementById('rub');

  function msg(t){ msgEl.textContent=t||''; }
  function update(){
    var s='';
    segList().forEach(function(l){ s+='<line x1="'+l[0][0]+'" y1="'+l[0][1]+'" x2="'+l[1][0]+'" y2="'+l[1][1]+'" stroke="#e8590c" stroke-width="0.11" stroke-linecap="round"/>'; });
    lg.innerHTML = s;
    var d='';
    for(var y=0;y<NY;y++) for(var x=0;x<NX;x++) d+='<circle cx="'+x+'" cy="'+y+'" r="0.1" fill="#45aee0"/>';
    if(sel) d+='<circle cx="'+sel[0]+'" cy="'+sel[1]+'" r="0.26" fill="none" stroke="#e8590c" stroke-width="0.07"/>';
    sg.innerHTML = d;
  }
  function nearest(p){
    var x=Math.round(p.x), y=Math.round(p.y);
    if(x<0||y<0||x>=NX||y>=NY) return null;
    if(Math.hypot(p.x-x,p.y-y) > 0.42) return null;
    return [x,y];
  }
  function same(a,b){ return a && b && a[0]===b[0] && a[1]===b[1]; }
  // せんを ひく。もう かいて ある せんを なぞったら けす（けしたら false）
  function add(a,b){
    var us = unitsOf(a,b);
    if(!us.length) return true;
    hist.push(Object.assign({}, segs));
    var erase = us.every(function(u){ return segs[u.k]; });
    if(erase){
      us.forEach(function(u){ delete segs[u.k]; });
      SFX.pop(); msg('せんを けしたよ');
    }else{
      us.forEach(function(u){ segs[u.k] = u.s; });
      SFX.put(); msg('');
    }
    if(!L.free && unitKey(segList())===modelKey){
      done=true; sel=null; update();
      setTimeout(function(){ celebrate('dots', li); }, 350);
    }
    return !erase;
  }
  svg.addEventListener('pointerdown', function(e){
    if(done) return;
    var p=svgPt(svg,e), d=nearest(p);
    if(!d){ sel=null; drag=null; update(); return; }
    if(sel && !same(sel,d)){ sel = add(sel,d) ? d : null; drag=null; update(); return; }
    // えらんで いる てんから なぞる ことも できる（はなした ところが おなじ てんなら えらびなおし）
    wasSel = same(sel,d);
    sel=d; drag=d; if(!wasSel) SFX.sel();
    try{ svg.setPointerCapture(e.pointerId); }catch(er){}
    update();
  });
  svg.addEventListener('pointermove', function(e){
    if(!drag) return;
    var p=svgPt(svg,e);
    rub.setAttribute('x1',drag[0]); rub.setAttribute('y1',drag[1]); rub.setAttribute('x2',p.x); rub.setAttribute('y2',p.y);
    rub.setAttribute('visibility', Math.hypot(p.x-drag[0],p.y-drag[1])>0.3 ? 'visible':'hidden');
  });
  function up(e){
    if(!drag) return;
    rub.setAttribute('visibility','hidden');
    var u=nearest(svgPt(svg,e));
    if(u && !same(u,drag) && !done){ var drew = add(drag,u); sel = (drew && !done) ? u : null; }
    else if(wasSel){ sel=null; }
    drag=null; wasSel=false; update();
  }
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', function(){ drag=null; rub.setAttribute('visibility','hidden'); });
  document.getElementById('undo').onclick=function(){ if(done || !hist.length) return; segs=hist.pop(); sel=null; SFX.pop(); msg(''); update(); };
  document.getElementById('clr').onclick=function(){ if(done || !segList().length) return; hist.push(Object.assign({}, segs)); segs={}; sel=null; msg(''); update(); };
  if(L.free) document.getElementById('fin').onclick=function(){
    if(!segList().length){ msg('まずは せんを かいてみよう'); return; }
    celebrate('dots', li);
  };
  update();
}

var SEG = { a:[0,0,1,0], b:[1,0,1,1], c:[1,1,1,2], d:[0,2,1,2], e:[0,1,0,2], f:[0,0,0,1], g:[0,1,1,1] };
function digit(segs, dx){ dx=dx||0; return Array.from(segs).map(function(k){ var s=SEG[k]; return [s[0]+dx,s[1],s[2]+dx,s[3]]; }); }
function digits2(a, b){ return digit(a,0).concat(digit(b,2)); }   // 2けたの かず（ひだりと みぎ）
var D = { 0:'abcdef', 1:'bc', 2:'abdeg', 3:'abcdg', 4:'bcfg', 5:'acdfg', 6:'acdefg', 7:'abc', 8:'abcdefg', 9:'abcdfg' };
function gridSticks(w, h){   // よこ w ます × たて h ます の ぼう
  var out=[], x, y;
  for(y=0;y<=h;y++) for(x=0;x<w;x++) out.push([x,y,x+1,y]);
  for(x=0;x<=w;x++) for(y=0;y<h;y++) out.push([x,y,x,y+1]);
  return out;
}
var GRID = [[0,0,1,0],[1,0,2,0],[0,1,1,1],[1,1,2,1],[0,2,1,2],[1,2,2,2],
            [0,0,0,1],[0,1,0,2],[1,0,1,1],[1,1,1,2],[2,0,2,1],[2,1,2,2]];
function without(list, rm){ var k=rm.map(String); return list.filter(function(s){ return k.indexOf(String(s))<0; }); }
var G32 = gridSticks(3,2);
var STICK_G = [
  [
    { name:'8 → 0', start:digit(D[8]), target:digit(D[0]) },
    { name:'8 → 6', start:digit(D[8]), target:digit(D[6]) },
    { name:'8 → 9', start:digit(D[8]), target:digit(D[9]) },

    { name:'8 → 1', start:digit(D[8]), target:digit(D[1]) },
    { name:'ながしかく 2つ', start:GRID, target:without(GRID,[[1,0,1,1],[1,1,1,2]]), sym:true },
    { name:'しかく 3つ',     start:GRID, target:without(GRID,[[0,0,1,0],[0,0,0,1]]), sym:true }
  ],
  [
    { name:'88 → 69', start:digits2(D[8],D[8]), target:digits2(D[6],D[9]) },

    { name:'88 → 24', start:digits2(D[8],D[8]), target:digits2(D[2],D[4]) },
    { name:'88 → 10', start:digits2(D[8],D[8]), target:digits2(D[1],D[0]) },
    { name:'たての ながしかく 3つ', start:G32, target:without(G32,[[0,1,1,1],[1,1,2,1],[2,1,3,1]]), sym:true },
    { name:'おおきな しかく と しかく 2つ', start:G32, target:without(G32,[[1,0,1,1],[1,1,1,2],[0,1,1,1],[1,1,2,1]]), sym:true }
  ]
];
function stickKey(s){
  var a=[s[0],s[1]], b=[s[2],s[3]];
  if(b[0]<a[0] || (b[0]===a[0] && b[1]<a[1])){ var t=a; a=b; b=t; }
  return a.concat(b).join(',');
}
var SYM = [
  function(u,v){return [u,v];}, function(u,v){return [-v,u];}, function(u,v){return [-u,-v];}, function(u,v){return [v,-u];},
  function(u,v){return [-u,v];}, function(u,v){return [u,-v];}, function(u,v){return [v,u];}, function(u,v){return [-v,-u];}
];
function stickSetKey(list, f, box){
  // box: [cx2, cy2] = ちゅうしんの 2ばい。ちゅうしんを もとに まわしたり うらがえしたり する
  return list.map(function(s){
    var p=f(2*s[0]-box[0], 2*s[1]-box[1]), q=f(2*s[2]-box[0], 2*s[3]-box[1]);
    return stickKey([p[0],p[1],q[0],q[1]]);
  }).sort().join(' ');
}
function stickBox(list){
  var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  list.forEach(function(s){ x0=Math.min(x0,s[0],s[2]); y0=Math.min(y0,s[1],s[3]); x1=Math.max(x1,s[0],s[2]); y1=Math.max(y1,s[1],s[3]); });
  return [x0+x1, y0+y1];
}
var WOOD = ['#f5c46b','#8fd3f5','#f7a8b8','#b5d957'];
function stickSvg(s, i, state){
  var x1=s[0],y1=s[1],x2=s[2],y2=s[3], dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), g=0.07;
  var ux=dx/len, uy=dy/len;
  var a=[x1+ux*g, y1+uy*g], b=[x2-ux*g, y2-uy*g];
  if(state==='gone'){
    return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#bbb" stroke-width="0.04" stroke-dasharray="0.08 0.08" stroke-linecap="round"/>';
  }
  var col = WOOD[i%WOOD.length];
  return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#666" stroke-width="0.15" stroke-linecap="round"/>'+
         '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+col+'" stroke-width="0.1" stroke-linecap="round"/>';
}
function sticksView(list){
  var mx=0,my=0; list.forEach(function(s){ mx=Math.max(mx,s[0],s[2]); my=Math.max(my,s[1],s[3]); });
  var w=Math.max(mx,1)+0.8, h=Math.max(my,1)+0.8, side=Math.max(w,h);
  return (-0.4-(side-w)/2)+' '+(-0.4-(side-h)/2)+' '+side+' '+side;
}
function sticksPreview(list, all){
  var s=''; list.forEach(function(st,i){ s+=stickSvg(st,i,''); });
  return '<svg viewBox="'+sticksView(all||list)+'" preserveAspectRatio="xMidYMid meet">'+s+'</svg>';
}

function playSticks(li){
  var L = LV('sticks')[li];
  var need = L.start.length - L.target.length;
  var gone, done;
  var box = stickBox(L.start), targetKeys = stickSetKey(L.target, SYM[0], box);
  var startKey = stickSetKey(L.start, SYM[0], box);
  // もとの かたちが かわらない まわしかた・うらがえしかた だけ つかう
  var syms = L.sym ? SYM.filter(function(f){ return stickSetKey(L.start, f, box)===startKey; }) : [SYM[0]];
  setHeader('<span class="no">'+(li+1)+'</span>'+L.name, function(){ showLevels('sticks'); });
  screen.innerHTML =
    '<div class="q">ぼうを <b style="color:#e8590c">'+need+'ぽん</b> とって、みぎの かたちに かえましょう。</div>'+
    '<div class="play"><div class="boardWrap" style="max-width:420px">'+
      '<svg id="bd" viewBox="'+sticksView(L.start)+'"><g id="sg"></g></svg></div>'+
      '<div class="side">'+
        '<div class="panel"><h3>➡ この かたちに しよう</h3>'+sticksPreview(L.target, L.start).replace('<svg ','<svg class="mini" ')+'</div>'+
        '<div class="panel"><div class="count" id="cnt"></div><div class="msg" id="msg"></div>'+
          '<div style="font-size:14px;color:#666">ぼうを タッチすると とれるよ。<br>もういちど タッチすると もどるよ。</div></div>'+
        '<div class="btns"><button class="btn" id="rst">↺ はじめから</button></div>'+
      '</div></div>';
  var svg=document.getElementById('bd'), sg=document.getElementById('sg'), cnt=document.getElementById('cnt'), msgEl=document.getElementById('msg');
  function msg(t){ msgEl.textContent=t||''; }
  function reset(){ gone={}; done=false; msg(''); update(); }
  function nGone(){ return Object.keys(gone).length; }
  function update(){
    var s='';
    L.start.forEach(function(st,i){ s+=stickSvg(st,i,gone[i]?'gone':''); });
    sg.innerHTML=s;
    cnt.innerHTML='とった ぼう：<big>'+nGone()+'</big> / '+need+' ぽん';
  }
  function distSeg(px,py,s){
    var x1=s[0],y1=s[1],x2=s[2],y2=s[3],dx=x2-x1,dy=y2-y1;
    var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }
  svg.addEventListener('pointerdown', function(e){
    if(done) return;
    var p=svgPt(svg,e), best=-1, bd=0.3;
    L.start.forEach(function(st,i){ var d=distSeg(p.x,p.y,st); if(d<bd){ bd=d; best=i; } });
    if(best<0) return;
    if(gone[best]){ delete gone[best]; SFX.put(); msg(''); update(); return; }
    if(nGone()>=need){ SFX.ng(); msg('とれるのは '+need+'ぽん までだよ。とった ぼうを タッチして もどそう'); return; }
    gone[best]=1; SFX.pop(); msg(''); update();
    if(nGone()===need){
      var rest = L.start.filter(function(s,i){ return !gone[i]; });
      var ok = syms.some(function(f){ return stickSetKey(rest,f,box)===targetKeys; });
      if(ok){ done=true; setTimeout(function(){ celebrate('sticks', li); }, 350); }
      else{ setTimeout(SFX.ng,200); msg('ちがう かたちに なったよ。ぼうを もどして やりなおそう'); }
    }
  });
  document.getElementById('rst').onclick=reset;
  reset();
}

           prev:function(l){ return shapePreview(l.start,true); } },
  dots:  { no:3, name:'てんを つなごう', sub:'てんと てんを せんで つないで かたちを かく', play:playDots,
           prev:function(l){
             if(l.free) return '<svg viewBox="-0.5 -0.5 4 3">'+dotsSvgContent(4,3,[],'#000',0)+'<text x="1.5" y="1.25" font-size="1.2" text-anchor="middle">✏️</text></svg>';
             var m=polyToLines(l.lines), b=linesBox(m);
             return '<svg viewBox="-0.5 -0.5 '+(b[0]+1)+' '+(b[1]+1)+'">'+dotsSvgContent(b[0]+1,b[1]+1,m,'#2a8c82',0.14)+'</svg>'; } },
  sticks:{ no:4, name:'ぼうを とろう', sub:'ぼうを とって、ちがう かたちに かえる', play:playSticks,
           prev:function(l){ return sticksPreview(l.target, l.start); } }
};
var MODE_ART = {
  tile: shapePreview(['◢◣','##'], true),
  move: '<svg viewBox="-0.2 -0.2 7.4 2.4"><g>'+piecesSvg(parseShape(['##']).pieces,function(p,i){return COLORS[i%4];},0.06)+'</g>'+
        '<text x="3.15" y="1.35" font-size="1.2" text-anchor="middle" fill="#3bb3a6">➡</text>'+
        '<g>'+piecesSvg(parseShape(['◢#◣'],4,0).pieces,function(p,i){return COLORS[[1,0,1,3][i]];},0.06)+'</g></svg>',
  dots: (function(){ var m=polyToLines(DOTS_G[0][4].lines); return '<svg viewBox="-0.5 -0.5 3 4">'+dotsSvgContent(3,4,m,'#e8590c',0.14)+'</svg>'; })(),
  sticks: sticksPreview(digit(D[8]))
};
function bar(done, total){
  return '<div class="bar"><i style="width:'+Math.round(100*done/total)+'%"></i></div>';
}
// ホーム：たんげん（ゲーム）を えらぶ
function showHome(){
  setHeader('<span class="no">14</span>かたちづくり', null);
  var s='<div class="q">あそびたい ゲームを えらんでね。</div><div class="modes">';
  Object.keys(MODES).forEach(function(k){
    var m=MODES[k], chips='';
    GRADES.forEach(function(name, g){
      var open=unlocked(k,g), d=gradeDone(k,g), t=gradeTotal(k,g);
      chips+='<span class="gc'+(open?'':' off')+(d>=t?' clear':'')+'">'+(g+1)+'ねん<br>'+(open ? (d>=t?'✅':'⭐'+d+'/'+t) : '🔒')+'</span>';
    });
    s+='<div class="mode" data-m="'+k+'">'+MODE_ART[k]+'<b>'+m.no+'. '+m.name+'</b><small>'+m.sub+'</small>'+
       '<div class="gcs">'+chips+'</div></div>';
  });
  s+='</div>';
  screen.innerHTML=s;
  screen.querySelectorAll('.mode').forEach(function(d){
    d.onclick=function(){ SFX.sel(); showGrades(d.getAttribute('data-m')); };
  });
}
// がくねん（レベル）を えらぶ
function showGrades(k){
  var m=MODES[k];
  setHeader('<span class="no">'+m.no+'</span>'+m.name, showHome);
  var s='<div class="q">レベルを えらんでね。ぜんぶ クリアすると、つぎの レベルが ひらくよ！</div><div class="grades">';
  GRADES.forEach(function(name, g){
    var open = unlocked(k,g), done = gradeDone(k,g), total = gradeTotal(k,g), ls = LV(k,g);
    s+='<div class="grade'+(open?'':' locked')+'" data-g="'+g+'">'+
       '<div class="gnum">'+(g+1)+'</div>'+
       '<div class="gbody"><b>'+name+' レベル</b>'+
       (open ? bar(done,total)+'<span class="prog">⭐ '+done+' / '+total+(done>=total?'　🎉 クリア！':'')+'</span>'
             : '<span class="lockmsg">🔒 '+GRADES[g-1]+'を ぜんぶ クリアすると ひらくよ（あと '+(gradeTotal(k,g-1)-gradeDone(k,g-1))+'もん）</span>')+
       '</div><div class="gart">'+(open ? m.prev(ls[Math.min(ls.length-1, 3)]) : '<span class="lock">🔒</span>')+'</div></div>';
  });
  s+='</div>';
  screen.innerHTML=s;
  screen.querySelectorAll('.grade').forEach(function(d){
    d.onclick=function(){
      var g=+d.getAttribute('data-g');
      if(!unlocked(k,g)){ SFX.ng(); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); return; }
      SFX.sel(); CUR_G = g; showLevels(k);
    };
  });
}
// もんだいを えらぶ
function showLevels(k){
  var m=MODES[k];
  setHeader('<span class="no">'+m.no+'</span>'+m.name+'<span class="gchip">'+GRADES[CUR_G]+'</span>', function(){ showGrades(k); });
  var s='<div class="q">もんだいを えらんでね。（⭐は できた もんだい）</div><div class="levels">';
  LV(k).forEach(function(l,i){
    s+='<div class="lv" data-i="'+i+'"><span class="num">'+(i+1)+'</span>'+(store.get(sk(k),i)?'<span class="star">⭐</span>':'')+m.prev(l)+
       '<span>'+l.name+'</span>'+(l.n?'<small class="tag">'+l.n+'まい うごかす</small>':'')+'</div>';
  });
  s+='</div>';
  screen.innerHTML=s;
  screen.querySelectorAll('.lv').forEach(function(d){
    d.onclick=function(){ SFX.sel(); openLevel(k, +d.getAttribute('data-i')); };
  });
}
function celebrate(k, li){
  var g = CUR_G, m = MODES[k], wasDone = gradeDone(k,g) >= gradeTotal(k,g);
  store.set(sk(k), li); SFX.ok();
  var nowDone = gradeDone(k,g) >= gradeTotal(k,g), newly = nowDone && !wasDone;
  var hasNext = li+1 < LV(k).length;
  var conf='';
  for(var i=0;i<(newly?80:36);i++){
    conf+='<i class="conf" style="left:'+(Math.random()*100)+'%;border-bottom-color:'+COLORS[i%4]+';animation-duration:'+(1.6+Math.random()*1.6)+'s;animation-delay:'+(Math.random()*(newly?1.5:0.6))+'s"></i>';
  }
  var extra = '';
  if(newly && g < GRADES.length-1){
    extra = '<div class="unlock">🎉「'+m.name+'」の '+GRADES[g]+' レベルを ぜんぶ クリア！<br><b>'+GRADES[g+1]+' レベル</b>が ひらいたよ！</div>';
  }else if(newly){
    extra = '<div class="unlock">🏆「'+m.name+'」を ぜんぶ クリア！<br>めいじん だね！</div>';
  }else{
    var left = gradeTotal(k,g) - gradeDone(k,g);
    if(left>0 && g < GRADES.length-1) extra = '<div class="left">'+GRADES[g+1]+' レベルまで あと '+left+'もん</div>';
  }
  var ov=el('<div class="overlay">'+conf+'<div class="ok"><div class="big">できた！</div><div class="stars">'+(newly?'🌟🌟🌟':'⭐')+'</div>'+extra+'<div class="btns">'+
    (newly && g < GRADES.length-1 ? '<button class="btn primary" data-a="grade">'+GRADES[g+1]+' レベルへ ▶</button>' : '')+
    (hasNext?'<button class="btn'+(newly?'':' primary')+'" data-a="next">つぎの もんだい ▶</button>':'')+
    '<button class="btn" data-a="again">もういちど</button><button class="btn" data-a="list">もんだいを えらぶ</button></div></div></div>');
  document.body.appendChild(ov);
  ov.onclick=function(e){
    var b=e.target.closest('button'); if(!b) return;
    var a=b.getAttribute('data-a');
    ov.remove();
    if(a==='next') openLevel(k, li+1);
    else if(a==='again') openLevel(k, li);
    else if(a==='grade'){ CUR_G = g+1; showLevels(k); }
    else showLevels(k);
  };
}

showHome();
})();
</script>
</body>
</html>
